function wirePairs(){const b=$("#pairGo");if(!b)return;b.onclick=()=>{const box=$("#pairQuiz");box.scrollIntoView({behavior:"smooth",block:"start"});
  runQuiz(box,pairQuestions(),(sc,tot)=>{touchStreak();save();updateChrome();box.innerHTML=`<div class="card result"><div class="eyebrow">Cặp từ dễ nhầm</div><div class="score num">${Math.round(sc/tot*100)}%</div><div>${sc}/${tot} câu đúng.</div><button class="btn" id="pairAgain">Làm lại</button></div>`;$("#pairAgain").onclick=()=>$("#pairGo").click()})}}

/* ===================== TỪ ĐIỂN ===================== */
ALL.forEach(w=>w.k=[nrm(w.p),nrm(w.m),nrm(w.v||"")]);
let dictQ="",dictWk="0",dictOnly=false,dictDay="0";
function viewDict(){
  app.innerHTML=`<nav class="jump" aria-label="Đi tới mục"><button data-jump="sec-search">Tra từ</button><button data-jump="askBox">Hỏi gia sư</button><button data-jump="sec-traps">Bẫy Hán Việt</button><button data-jump="pairBox">Cặp từ dễ nhầm</button><button data-jump="errBox">Câu nào đúng</button><button data-jump="lookBox">Chữ giống nhau</button><button data-jump="mwBox">Lượng từ</button><button data-jump="rpBox">Nhập vai</button><button data-jump="phBox">Mẫu câu</button></nav>${trapsHTML()}<section class="sect" id="sec-search"><div><div class="eyebrow">Từ điển</div><h2>${ALL.length} từ của khóa học</h2>
    <p class="muted" style="margin:6px 0 0;max-width:64ch">Tìm bằng chữ Hán, pinyin không dấu (nihao), nghĩa tiếng Việt hoặc âm Hán Việt (nhĩ hảo).</p></div>
    <div class="row"><input id="dq" class="search" type="search" placeholder="Tìm: 你好, nihao, xin chào, hảo" value="${esc(dictQ)}" aria-label="Tìm từ">
      <select id="dw" class="btn" aria-label="Lọc theo chặng"><option value="0">Mọi chặng</option>${WEEKS.filter(w=>w.n!==5).map(w=>`<option value="${w.n}" ${dictWk==w.n?"selected":""}>Chặng ${w.n}: ${w.name}</option>`).join("")}</select><select id="dd" class="btn" aria-label="Lọc theo bài" style="flex:1 1 200px;min-width:0;max-width:100%;width:100%;text-overflow:ellipsis"><option value="0">Mọi bài</option>${DAYS.filter(d=>d.words.length).map(d=>`<option value="${d.n}" ${dictDay==d.n?"selected":""}>Ngày ${d.n}: ${esc(d.t)}</option>`).join("")}</select>
      <label class="row" style="gap:6px;font-size:.9rem"><input type="checkbox" id="donly" ${dictOnly?"checked":""}> Chỉ từ đã học</label></div>
    <div class="eyebrow num" id="dcount"></div><div class="dlist" id="dlist"></div>${cwHTML()}</section>`;
  wirePairs();wirePhrases();rpRole();
  const draw=()=>{const q=nrm(dictQ),raw=dictQ.trim();
    const res=ALL.filter(w=>(dictWk==="0"||DAYS[w.day-1].week==+dictWk)&&(dictDay==="0"||w.day==+dictDay)&&(!dictOnly||S.srs[w.h])&&(!q||w.h.includes(raw)||w.k.some(k=>k.includes(q))));
    $("#dcount").textContent=res.length+" từ";
    const tail=raw&&res.length<3&&aiNS&&!aiOff?`<div class="drow" style="grid-template-columns:1fr auto"><div class="muted" style="font-size:.88rem">${res.length?"Chưa thấy từ bạn cần?":"Không có trong khóa học."} Hỏi gia sư AI về “${esc(raw)}”.</div><button class="btn" id="dqAI">Tra bằng AI</button></div><div id="dqAIo"></div>`:"";
    setTimeout(()=>{const l=$("#dlist");if(l&&tail&&!$("#dqAI"))l.insertAdjacentHTML("beforeend",tail)},0);
    $("#dlist").innerHTML=res.map(w=>{const c=S.srs[w.h];return `<div class="drow"><span class="han dh">${w.h}</span><div style="min-width:0"><div class="py">${pyHTML(w.p)}</div><div>${esc(w.m)}</div>${noteHTML(w.h)}</div><div class="dmeta"><span class="hvs">${esc(w.v||"")}</span><a href="#day-${w.day}">Ngày ${w.day}</a>${c?`<span class="chip">Ôn: ${BOXL[Math.min(6,c.b)]}</span>`:""}</div><button class="say" data-say="${esc(w.h)}" aria-label="Nghe">${SPK}</button></div>`}).join("")||`<div class="card muted">Không tìm thấy từ nào. Thử gõ không dấu hoặc bỏ bớt bộ lọc.</div>`};
  $("#dq").oninput=e=>{dictQ=e.target.value;draw()};
  $("#dw").onchange=e=>{dictWk=e.target.value;dictDay="0";$("#dd").value="0";draw()};
  $("#dd").onchange=e=>{dictDay=e.target.value;if(dictDay!=="0"){dictWk="0";$("#dw").value="0"}draw()};
  $("#donly").onchange=e=>{dictOnly=e.target.checked;draw()};
  draw();
}
document.addEventListener("click",e=>{const bar=$("#lk");const sp=e.target.closest("[data-lk]");
  if(sp){const w=BYH[sp.dataset.lk];if(!w){lkUnknown(bar,sp.dataset.lk);return}
    bar.innerHTML=`<span class="han" style="font-size:2rem;line-height:1">${w.h}</span><div style="min-width:0;flex:1"><div class="py">${pyHTML(w.p)}</div><div>${esc(w.m)}${w.v?` · <span class="hvs" style="font-size:.74rem">${esc(w.v)}</span>`:""}</div>${noteHTML(w.h)}${famHTML(w)}${w.extra?`<span class="muted" style="font-size:.8rem">Từ bổ sung, ngoài 40 ngày học</span>`:`${w.day?`<a href="#day-${w.day}" class="muted" style="font-size:.8rem">Học ở Ngày ${w.day}</a>`:`<span class="muted" style="font-size:.8rem">Từ bạn tự thêm</span>`}`}</div><div style="display:grid;gap:6px;align-self:start"><button class="say" data-say="${esc(w.h)}" aria-label="Nghe">${SPK}</button>${S.srs[w.h]?"":`<button class="say" data-addcw="${encodeURIComponent(JSON.stringify([w.h,w.p,w.m,w.v||""]))}" aria-label="Thêm ${esc(w.h)} vào thẻ ôn" title="Thêm vào thẻ ôn">＋</button>`}${[...w.h].every(c=>CHARSET.has(c))?`<button class="say" data-writew="${esc(w.h)}" aria-label="Tập viết ${esc(w.h)}" title="Tập viết">✍</button>`:""}<button class="say" id="lkx" aria-label="Đóng">✕</button></div>`;
    bar.hidden=false;speak(w.h);return}
  if(!e.target.isConnected)return;
  if(!e.target.closest("#lk")||e.target.closest("#lkx")||e.target.closest("#lk a"))bar.hidden=true;
});

/* ===================== ĐIỀU HƯỚNG ===================== */
function updateChrome(){const s=streakNow();$("#streakChip").textContent=`Chuỗi ${s} ngày${(S.streak.fz==null?1:S.streak.fz)>0?" · 🧊"+(S.streak.fz==null?1:S.streak.fz):""}`;$("#streakChip").title="🧊 = ngày nghỉ: bỏ lỡ một ngày mà vẫn giữ chuỗi. Cứ 7 ngày liên tục được thêm 1 (tối đa 2).";const b=$("#dueBadge");if(b){const n=dueList().length;b.hidden=!n;b.textContent=n>99?"99+":n}}
let lastDay=null;
function route(){
  loadCW();
  hush();document.onkeydown=null;if(MOCKT){clearInterval(MOCKT.iv);MOCKT=null}SHRUN=0;QZ=null;TR=null;IME=null;DCT=null;$("#lk").hidden=true;if(dictNS&&dictNS.active())dictNS.stop().catch(()=>{});spCtx=null;psvRun++;
  const h=(location.hash||"#today").slice(1);
  let key=h.startsWith("day-")?"plan":h;
  if(h.startsWith("day-")){const n=+h.slice(4);if(n!==lastDay){dayTab="vocab";lastDay=n}viewDay(n)}
  else{lastDay=null;if(h==="plan")viewPlan();else if(h==="review"){revQueue=null;viewReview()}else if(h==="tones")viewTones();else if(h==="write")viewWrite();else if(h==="dict")viewDict();else{key="today";viewToday()}}
  document.querySelectorAll("#nav a, #bnav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+key?"page":"false"));
  updateChrome();refreshAudioHints();
  document.querySelectorAll(".jump [data-jump]").forEach(b=>{if(!document.getElementById(b.dataset.jump))b.remove()});
  if(pendingGo){const go=pendingGo;pendingGo=null;setTimeout(()=>{const t=document.getElementById(go);if(!t)return;if(t.tagName==="DETAILS")t.open=true;t.scrollIntoView({block:"start"})},60)}
}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});
function snapshot(){return {qz:QZ&&QZ.id==="dayBody"?{...QZ,hash:location.hash}:null,dayTab,lastDay,revMode,revQueue:revQueue&&revQueue.length?revQueue.slice():null,dictQ,dictWk,dictOnly,dictDay,ndType,rpIdx,phraseIdx,scroll:window.scrollY}}
function start(data){data=data||{};
  if(data.dayTab)dayTab=data.dayTab;if(data.lastDay!=null)lastDay=data.lastDay;if(data.revMode)revMode=data.revMode;
  if(typeof data.dictQ==="string")dictQ=data.dictQ;if(data.dictWk)dictWk=data.dictWk;if(data.dictOnly!=null)dictOnly=data.dictOnly;if(data.dictDay)dictDay=data.dictDay;
  if(data.ndType)ndType=data.ndType;if(data.rpIdx!=null)rpIdx=data.rpIdx;if(data.phraseIdx!=null)phraseIdx=data.phraseIdx;
  route();
  if(data.revQueue&&location.hash==="#review"){revQueue=data.revQueue.filter(h=>S.srs[h]);if(revQueue.length)viewReview()}
  if(data.qz&&data.qz.hash===location.hash&&dayTab==="quiz"&&$("#dayBody")){const n=+location.hash.slice(5);if(DAYS[n-1])runQuiz($("#dayBody"),data.qz.qs,dayQuizDone(n),data.qz)}
  if(data.scroll)requestAnimationFrame(()=>window.scrollTo(0,data.scroll));
  initRemote()}
try{window.claude?.hot?.snapshot?.(snapshot)}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
