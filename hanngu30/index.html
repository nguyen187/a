<title>Hán Ngữ 30 Ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: sổ tay luyện chữ — giấy ngọc bích nhạt, chữ Hán làm nhân vật chính, pinyin tô màu theo thanh điệu; một cột rộng 920px, tab dính phía trên. */
:root{
  --paper:#F2F6F4; --surface:#FFFFFF; --sunk:#E7EFEB; --ink:#16211C; --muted:#5A6B64; --line:#D3DED9;
  --jade:#15745B; --jade-ink:#FFFFFF; --jade-soft:#DAEEE6; --seal:#B5332F; --seal-soft:#F6E1DF; --seal-ink:#FFFFFF;
  --good:#1E8A4C; --bad:#C0392B; --warn:#B7791F;
  --t1:#C6343A; --t2:#C2770E; --t3:#21864A; --t4:#2D62C2; --t5:#7B8883;
  --grid:#E3A9A6;
  --f-han:"Noto Serif SC","Songti SC","SimSun","PingFang SC",serif;
  --f-ui:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1412; --surface:#161F1B; --sunk:#1C2723; --ink:#E5EEEA; --muted:#93A49D; --line:#2A3833;
  --jade:#4CC29E; --jade-ink:#06130E; --jade-soft:#17332A; --seal:#EE716A; --seal-soft:#3A1F1D; --seal-ink:#2A0C0A;
  --good:#5FCB8A; --bad:#F07A6E; --warn:#E9B35A;
  --t1:#F2797D; --t2:#F0AA4C; --t3:#62CC8C; --t4:#7DA6F3; --t5:#9AA9A3; --grid:#6B3C3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1412; --surface:#161F1B; --sunk:#1C2723; --ink:#E5EEEA; --muted:#93A49D; --line:#2A3833;
  --jade:#4CC29E; --jade-ink:#06130E; --jade-soft:#17332A; --seal:#EE716A; --seal-soft:#3A1F1D; --seal-ink:#2A0C0A;
  --good:#5FCB8A; --bad:#F07A6E; --warn:#E9B35A;
  --t1:#F2797D; --t2:#F0AA4C; --t3:#62CC8C; --t4:#7DA6F3; --t5:#9AA9A3; --grid:#6B3C3A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.seal{width:34px;height:34px;border-radius:7px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:20px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--sunk);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.seal-c{background:var(--seal-soft);color:var(--seal)}
.spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--jade);border-bottom-color:var(--jade)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center}

main{padding-block:24px 64px;display:grid;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;text-decoration:none;color:var(--ink);font-size:.92rem}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* pinyin tone colors */
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.py{font-weight:500}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.daybig{display:flex;align-items:baseline;gap:10px}
.daybig b{font-size:4.2rem;line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--jade)}
.daybig span{font-size:1.2rem;color:var(--muted);font-weight:600}
.hero p{margin:8px 0 0;max-width:46ch}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.strip a{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none;background:var(--surface);max-width:100%}
.strip a.done{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.strip a.cur{border:2px solid var(--seal);color:var(--seal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:14px 16px;border-radius:var(--r);background:var(--sunk)}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lesson-card{display:grid;gap:12px}
.lesson-card .han-preview{font-family:var(--f-han);font-size:1.7rem;word-spacing:.5em;color:var(--ink);overflow-wrap:anywhere}
.method{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.method div{border-top:3px solid var(--jade);padding-top:8px;font-size:.86rem}
.method b{display:block;font-size:.92rem}
.method i{font-style:normal;color:var(--muted);font-size:.78rem;font-weight:600}

/* plan */
.week{display:grid;gap:12px}
.week-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.dcard:hover{border-color:var(--jade)}
.dcard .n{grid-row:span 2;width:38px;height:38px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.dcard.done .n{background:var(--jade);color:var(--jade-ink)}
.dcard.cur{border-color:var(--seal)}
.dcard.cur .n{background:var(--seal);color:var(--seal-ink)}
.dcard b{font-size:.92rem;line-height:1.3}
.dcard small{color:var(--muted);font-size:.78rem}

/* day */
.dayhead{display:grid;gap:6px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:600;font-size:.88rem}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.subtabs button[aria-pressed="true"] span{color:inherit!important}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:grid;gap:2px;text-align:left;position:relative}
.word:hover{border-color:var(--jade)}
.word .h{font-family:var(--f-han);font-size:2.1rem;line-height:1.2;font-weight:500}
.word .py{font-size:1.02rem}
.word .m{font-size:.9rem}
.word .hv{font-size:.74rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.word .spk{position:absolute;top:10px;right:10px;color:var(--muted)}
.gram{display:grid;gap:14px}
.gram p{margin:0;max-width:68ch}
.gram ul{margin:0;padding-left:20px;display:grid;gap:4px;max-width:68ch}
.pat{font-family:var(--f-han);background:var(--jade-soft);border-radius:8px;padding:10px 14px;font-size:1.05rem;overflow-x:auto}
.ex{display:grid;gap:8px}
.exl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);align-items:center}
.exl .zh{font-family:var(--f-han);font-size:1.25rem}
.exl .p{color:var(--muted);font-size:.9rem}
.exl .v{font-size:.9rem}
.exl > button{grid-row:span 3;align-self:center}
.say{border:1px solid var(--line);background:var(--sunk);border-radius:99px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.say:hover{border-color:var(--jade);color:var(--jade)}
.say svg,.icon-btn svg,.word .spk svg,.btn svg{width:16px;height:16px;flex:none}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--jade-soft);flex-wrap:wrap}
.banner .seal{flex:none}

/* quiz */
.quiz{display:grid;gap:16px;max-width:640px}
.qbar{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.prompt{text-align:center;padding:22px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:6px;justify-items:center}
.prompt .h{font-family:var(--f-han);font-size:3.2rem;line-height:1.15}
.prompt .m{font-size:1.25rem;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;gap:10px;align-items:center;min-height:58px}
.opt:hover:not([disabled]){border-color:var(--jade)}
.opt .k{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-weight:600}
.nopy .exl .p,.novi .exl .v{display:none}
.seg-unk{border-bottom:1px dotted var(--muted)}
.lite-hide{display:none!important}
.opt .hz{font-family:var(--f-han);font-size:1.5rem}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:var(--r);background:var(--sunk);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.fb .detail{color:var(--ink)}
.result{display:grid;gap:12px;justify-items:start}
.score{font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

/* flashcard */
.flash{display:grid;gap:14px;max-width:560px}
.fc{min-height:260px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:24px;gap:6px;cursor:pointer}
.fc .h{font-family:var(--f-han);font-size:4rem;line-height:1.15}
.fc .py{font-size:1.4rem}
.fc .m{font-size:1.1rem}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 6px;font-weight:600;display:grid;gap:2px}
.grade button small{font-weight:500;color:var(--muted);font-size:.74rem}
.grade .g0{color:var(--bad)} .grade .g1{color:var(--warn)} .grade .g2{color:var(--good)} .grade .g3{color:var(--jade)}
.boxes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.boxes div{display:grid;gap:4px;justify-items:center;align-self:end}
.boxes i{display:block;width:100%;max-width:46px;background:var(--jade);border-radius:5px 5px 0 0;min-height:2px}
.boxes small{font-size:.72rem;color:var(--muted)}

/* tones */
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tone{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:grid;gap:6px}
.tone svg{width:100%;height:auto;max-width:100%}
.tone .big{font-size:1.6rem;font-weight:700}
.tone p{margin:0;font-size:.86rem}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td b{font-size:1.05rem}
.tq{display:grid;gap:14px;max-width:560px}
.tq .opts{grid-template-columns:repeat(4,1fr)}
.tq .opt{justify-content:center;font-size:1.3rem;font-weight:600}

/* write */
.writer{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.pad{position:relative;width:min(300px,82vw);aspect-ratio:1;border:2px solid var(--grid);border-radius:4px;background:var(--surface);touch-action:none;max-width:100%}
.pad::before,.pad::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat;opacity:.7}
.pad::after{background:linear-gradient(45deg,transparent calc(50% - .5px),var(--grid) 50%,transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--grid) 50%,transparent calc(50% + .5px));opacity:.35}
.ghostch{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-han);font-size:min(230px,63vw);line-height:1;color:var(--ink);opacity:.12;pointer-events:none;user-select:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad svg{position:relative;z-index:1;display:block}
.pad .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.charlist button.done{background:var(--jade-soft)}
.charlist button{position:relative}
.charlist button.done::after{content:"✓";position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--jade);color:var(--jade-ink);font:700 10px/16px var(--f-ui)}
.charlist{display:flex;flex-wrap:wrap;gap:6px}
.charlist button{font-family:var(--f-han);font-size:1.3rem;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.charlist button[aria-pressed="true"]{border-color:var(--seal);color:var(--seal);border-width:2px}
.rad{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rad button{font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}
.rad button[aria-expanded="true"]{border-color:var(--jade);background:var(--jade-soft)}
.rad div,.rad button{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);display:flex;gap:10px;align-items:center}
.rad b{font-family:var(--f-han);font-size:1.6rem;font-weight:500}
.rad span{font-size:.8rem;line-height:1.3}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.dialog{display:grid;gap:8px}
.dl{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.dl .who{grid-row:span 3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--sunk)}
.dl .who.b{background:var(--jade-soft);color:var(--jade)}
.dl .zh{font-family:var(--f-han);font-size:1.15rem}
.dl .p{color:var(--muted);font-size:.86rem}
.dl .v{font-size:.86rem}
.dl > button{grid-row:1 / span 3;grid-column:3}
.sect{display:grid;gap:14px}

.slots{min-height:64px;border:2px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface)}
.slots.ok{border-color:var(--good);border-style:solid}.slots.no{border-color:var(--bad);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chunk{font-family:var(--f-han);font-size:1.3rem;padding:8px 12px;border-radius:8px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface)}
.chunk:hover:not([disabled]){border-color:var(--jade)}
.chunk[disabled]{opacity:.25;cursor:default}
.typein{display:flex;gap:8px;flex-wrap:wrap}
.typein input,.search{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search{font-size:1rem;flex-basis:240px}
.typein input.ok{border-color:var(--good);border-width:2px}.typein input.no{border-color:var(--bad);border-width:2px}
.seg{cursor:pointer;border-radius:3px}.seg:hover{background:var(--jade-soft)}
.lkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 32px rgba(0,0,0,.2);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;width:min(440px,calc(100% - 32px))}
#lk:not([hidden]) + .toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.dlist{display:grid;gap:6px}
.wbars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wbars div{display:grid;gap:3px;justify-items:center;align-self:end}
.wbars i{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0}
.wbars small{font-size:.7rem;color:var(--muted)}
.wgoal{position:absolute;left:0;right:0;border-top:1px dashed var(--seal);opacity:.7}
.words.hide-py .word:not(.shown) .py,.words.hide-m .word:not(.shown) .m,.words.hide-m .word:not(.shown) .hv,.words.hide-m .word:not(.shown) .noteline{visibility:hidden}
.blind .exl .zh,.blind .exl .p,.blind .exl .v{visibility:hidden}
.blind .exl{min-height:48px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:72px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;display:grid;place-items:center;text-align:center;font-size:.86rem;line-height:1.3}
.tile.hz{font-family:var(--f-han);font-size:1.6rem}
.tile[aria-pressed="true"]{border-color:var(--jade);border-width:2px;background:var(--jade-soft)}
.tile.done{visibility:hidden}
.tile.bad{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cert{border:2px solid var(--seal);border-radius:14px;padding:6px;background:var(--surface)}
.cert-in{border:1px solid var(--seal);border-radius:10px;padding:22px 20px;display:grid;gap:10px;text-align:center;justify-items:center;background:color-mix(in srgb,var(--seal) 5%,var(--surface))}
.cert-name{font:700 1.7rem var(--f-han),var(--f-ui);text-align:center;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);width:min(100%,360px);padding:4px}
.cert-in p{margin:0}
.cert-stats{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.cert-stats div{display:grid}.cert-stats b{font-size:1.4rem}.cert-stats span{font-size:.78rem;color:var(--muted)}
.cert .row{width:100%}
.cert-seal{width:58px;height:58px;border-radius:8px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font:700 2rem var(--f-han);transform:rotate(-6deg)}
.bm{border:0;background:none;color:var(--muted);font-size:1.05rem;padding:0 6px;vertical-align:middle;line-height:1}
.bm[aria-pressed="true"]{color:var(--warn)}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--jade)}
.jump button:hover{border-color:var(--jade)}
[id^="sec-"],#pairBox,#phBox,#mwBox,#rpBox,#lookBox,.card.sect{scroll-margin-top:120px}
.note{display:grid;gap:4px}
.note textarea{font:inherit;font-size:.95rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:52px}
.noteline{font-size:.82rem;color:var(--seal);line-height:1.4}
.fam{font-size:.84rem;color:var(--muted);line-height:1.6}
.fam .seg{color:var(--ink);font-family:var(--f-han);font-size:1rem;padding:0 2px}
details.card summary{cursor:pointer;list-style-position:outside}
details.card summary::marker{color:var(--jade)}
.drow{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dh{font-size:1.7rem;white-space:nowrap}
.dmeta{display:grid;justify-items:end;gap:2px;font-size:.78rem}
.dmeta a{color:var(--muted)}
.hvs{text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:var(--muted)}
.rate{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rate input{accent-color:var(--jade);flex:1;min-width:120px;max-width:260px}
.tgt{font-family:var(--f-han);font-size:2rem;line-height:1.4;letter-spacing:.04em;overflow-wrap:anywhere}
.tgt .hit{color:var(--good)} .tgt .miss{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.heard{padding:12px 14px;border-radius:var(--r);background:var(--sunk);display:grid;gap:4px}
.heard .han{font-size:1.2rem}
.btn.on:not(.mic){border-color:var(--jade);background:var(--jade-soft);color:var(--jade-ink)}
.mic.on{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.meter{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden;max-width:320px}
.meter i{display:block;height:100%}
.heat{display:grid;grid-template-columns:repeat(35,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--sunk);max-width:100%}
.heat i.h1{background:color-mix(in srgb,var(--jade) 30%,var(--sunk))}
.heat i.h2{background:color-mix(in srgb,var(--jade) 55%,var(--sunk))}
.heat i.h3{background:color-mix(in srgb,var(--jade) 80%,var(--sunk))}
.heat i.h4{background:var(--jade)}
.heat i.today{outline:2px solid var(--seal);outline-offset:1px}
@media (max-width:520px){.drow{grid-template-columns:minmax(48px,auto) 1fr auto}.dmeta{display:none}}
.bnav{display:none}
@media (max-width:600px){
  nav.tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav a{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:.68rem;font-weight:600;color:var(--muted);text-decoration:none;position:relative}

  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

}
@media (max-width:720px){
  .hero,.two{grid-template-columns:1fr}

  .tones{grid-template-columns:1fr 1fr}
  .writer{grid-template-columns:1fr}
  .daybig b{font-size:3.3rem}
}
@media (max-width:420px){.opts{grid-template-columns:1fr}.tq .opts{grid-template-columns:repeat(2,1fr)}}

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<script>
/* ===================== DỮ LIỆU 30 NGÀY ===================== */
/* mỗi dòng từ: chữ Hán | pinyin (âm tiết cách nhau dấu cách) | nghĩa | âm Hán Việt */
const WEEKS=[
  {n:1,name:"Nền móng",sub:"Pinyin, thanh điệu, chào hỏi, số đếm, gia đình"},
  {n:2,name:"Đời sống hằng ngày",sub:"Ăn uống, mua sắm, lượng từ, vị trí, thói quen"},
  {n:3,name:"Giao tiếp ứng dụng",sub:"Đi lại, thời tiết, sở thích, sức khỏe, 了 và 过"},
  {n:4,name:"Diễn đạt trôi chảy",sub:"So sánh, bổ ngữ, liên từ, du lịch, công việc"},
  {n:5,name:"Tổng kết",sub:"Hội thoại tổng hợp và bài kiểm tra cuối"},
  {n:6,name:"Mở rộng HSK 3",sub:"Học thêm sau khóa chính: 10 ngày, các mẫu câu HSK 3"}
];
const DAYS=[
{t:"Chào hỏi & thanh điệu",w:`你|nǐ|bạn, anh, chị (ngôi thứ 2)|nhĩ
好|hǎo|tốt, khỏe|hảo
你好|nǐ hǎo|xin chào|nhĩ hảo
我|wǒ|tôi, mình|ngã
是|shì|là|thị
不|bù|không|bất
谢谢|xiè xie|cảm ơn|tạ tạ
不客气|bú kè qi|đừng khách sáo, không có gì|bất khách khí
再见|zài jiàn|tạm biệt|tái kiến
对不起|duì bu qǐ|xin lỗi|đối bất khởi
没关系|méi guān xi|không sao|một quan hệ`,
g:"Bốn thanh điệu và hai quy tắc biến điệu",
gh:`<p>Tiếng Trung có 4 thanh và 1 thanh nhẹ. Đọc sai thanh là đổi nghĩa: <b>mā</b> 妈 (mẹ) khác <b>mǎ</b> 马 (ngựa). Màu chữ pinyin trong app này luôn cho bạn biết thanh: <span class="t1">thanh 1</span>, <span class="t2">thanh 2</span>, <span class="t3">thanh 3</span>, <span class="t4">thanh 4</span>, <span class="t5">thanh nhẹ</span>.</p>
<p><b>Biến điệu 3 + 3:</b> hai thanh 3 đứng liền nhau thì thanh 3 đầu đọc thành thanh 2.</p>
<div class="pat">你好 nǐ hǎo → đọc là ní hǎo</div>
<p><b>Biến điệu của 不:</b> 不 vốn đọc bù, nhưng đứng trước thanh 4 thì đọc bú.</p>
<div class="pat">不客气 bù kèqi → bú kèqi　·　不是 → bú shì</div>`,
ex:`你好！|Nǐ hǎo!|Xin chào!
谢谢！— 不客气。|Xièxie! — Bú kèqi.|Cảm ơn! — Không có gì.
对不起。— 没关系。|Duìbuqǐ. — Méi guānxi.|Xin lỗi. — Không sao.
再见！|Zàijiàn!|Tạm biệt!`},

{t:"Giới thiệu bản thân",w:`他|tā|anh ấy, ông ấy|tha
她|tā|cô ấy, bà ấy|tha
我们|wǒ men|chúng tôi, chúng ta|ngã môn
你们|nǐ men|các bạn|nhĩ môn
他们|tā men|họ|tha môn
叫|jiào|gọi, tên là|khiếu
名字|míng zi|tên|danh tự
什么|shén me|cái gì|thập ma
老师|lǎo shī|giáo viên|lão sư
学生|xué sheng|học sinh|học sinh
中国|Zhōng guó|Trung Quốc|Trung Quốc
越南|Yuè nán|Việt Nam|Việt Nam
人|rén|người|nhân`,
g:"Câu chữ 是: A 是 B",
gh:`<p>是 nối hai danh từ, giống "là". Phủ định thêm 不 trước 是. Danh từ chỉ quốc tịch = tên nước + 人.</p>
<div class="pat">A + 是 + B　　A + 不是 + B</div>
<ul><li>Động từ tiếng Trung <b>không chia</b> theo ngôi hay thì: 我是, 他是, 他们是 đều giống nhau.</li>
<li>们 thêm sau đại từ chỉ người để thành số nhiều.</li></ul>`,
ex:`我是越南人。|Wǒ shì Yuènán rén.|Tôi là người Việt Nam.
他不是老师，他是学生。|Tā bú shì lǎoshī, tā shì xuésheng.|Anh ấy không phải giáo viên, anh ấy là học sinh.
你叫什么名字？|Nǐ jiào shénme míngzi?|Bạn tên là gì?
我叫阿明。|Wǒ jiào Ā Míng.|Tôi tên là Minh.`},

{t:"Hỏi thăm: 吗 và 呢",w:`吗|ma|(trợ từ nghi vấn)|ma
呢|ne|còn… thì sao?|ni
很|hěn|rất|ngận
也|yě|cũng|dã
都|dōu|đều|đô
忙|máng|bận|mang
累|lèi|mệt|lụy
高兴|gāo xìng|vui mừng|cao hứng
认识|rèn shi|quen biết|nhận thức
朋友|péng you|bạn bè|bằng hữu
怎么样|zěn me yàng|thế nào|chẩm ma dạng`,
g:"Câu hỏi 吗, câu hỏi tỉnh lược 呢 và tính từ làm vị ngữ",
gh:`<p>Thêm 吗 vào cuối câu trần thuật là thành câu hỏi có/không. 呢 dùng để hỏi lại "còn bạn thì sao?".</p>
<div class="pat">Câu trần thuật + 吗？　　Danh từ/Đại từ + 呢？</div>
<p>Tính từ đứng ngay sau chủ ngữ, <b>không cần 是</b>. Thường thêm 很 cho câu tự nhiên (很 lúc này không mạnh nghĩa "rất").</p>
<div class="pat">我很忙。(không nói 我是忙)</div>
<p>Vị trí phó từ: 也 và 都 luôn đứng trước động từ/tính từ, nếu đi cùng thì 也 trước 都.</p>`,
ex:`你忙吗？|Nǐ máng ma?|Bạn có bận không?
我很好，你呢？|Wǒ hěn hǎo, nǐ ne?|Tôi khỏe, còn bạn?
我们也都很累。|Wǒmen yě dōu hěn lèi.|Chúng tôi cũng đều rất mệt.
认识你很高兴。|Rènshi nǐ hěn gāoxìng.|Rất vui được quen bạn.`},

{t:"Số đếm và tuổi",w:`一|yī|một|nhất
二|èr|hai|nhị
三|sān|ba|tam
四|sì|bốn|tứ
五|wǔ|năm|ngũ
六|liù|sáu|lục
七|qī|bảy|thất
八|bā|tám|bát
九|jiǔ|chín|cửu
十|shí|mười|thập
百|bǎi|trăm|bách
零|líng|số không|linh
两|liǎng|hai (dùng trước lượng từ)|lưỡng
几|jǐ|mấy (dưới 10)|kỷ
多少|duō shao|bao nhiêu|đa thiểu
岁|suì|tuổi|tuế
个|gè|cái, chiếc (lượng từ chung)|cá`,
g:"Đếm số, 二 hay 两, 几 hay 多少",
gh:`<p>Ghép số giống tiếng Việt: 十一 = 11, 二十 = 20, 三十五 = 35, 一百 = 100, 一百零五 = 105.</p>
<ul><li><b>二</b> dùng khi đếm, đọc số, số thứ tự: 二十, 第二.</li>
<li><b>两</b> dùng trước lượng từ: 两个人 (hai người), không nói 二个人.</li>
<li><b>几</b> hỏi số lượng ước dưới 10 (tuổi trẻ em, số người trong nhà). <b>多少</b> hỏi số bất kỳ.</li></ul>
<p><b>Biến điệu của 一:</b> trước thanh 4 đọc yí (一个 yí gè), trước thanh 1, 2, 3 đọc yì; khi đếm đọc yī.</p>`,
ex:`你几岁？|Nǐ jǐ suì?|Em mấy tuổi?
我二十岁。|Wǒ èrshí suì.|Tôi hai mươi tuổi.
两个人|liǎng gè rén|hai người
你们有多少人？|Nǐmen yǒu duōshao rén?|Các bạn có bao nhiêu người?`},

{t:"Gia đình",w:`家|jiā|nhà, gia đình|gia
爸爸|bà ba|bố|bá bá
妈妈|mā ma|mẹ|ma ma
哥哥|gē ge|anh trai|ca ca
姐姐|jiě jie|chị gái|thư thư
弟弟|dì di|em trai|đệ đệ
妹妹|mèi mei|em gái|muội muội
有|yǒu|có|hữu
没有|méi yǒu|không có|một hữu
口|kǒu|(lượng từ cho người trong nhà)|khẩu
的|de|của|đích
儿子|ér zi|con trai|nhi tử
女儿|nǚ ér|con gái|nữ nhi`,
g:"有 / 没有 và 的 sở hữu",
gh:`<p>有 nghĩa là "có". Phủ định của 有 là <b>没有</b>, không bao giờ nói 不有.</p>
<div class="pat">A + 有/没有 + B</div>
<p>的 đặt giữa người sở hữu và vật: 我的书 (sách của tôi). <b>Thứ tự ngược với tiếng Việt</b>: người sở hữu đứng trước.</p>
<div class="pat">我的妈妈 = mẹ của tôi　→ thân mật có thể bỏ 的: 我妈妈</div>`,
ex:`你家有几口人？|Nǐ jiā yǒu jǐ kǒu rén?|Nhà bạn có mấy người?
我家有四口人。|Wǒ jiā yǒu sì kǒu rén.|Nhà tôi có bốn người.
我没有哥哥，我有一个妹妹。|Wǒ méiyǒu gēge, wǒ yǒu yí gè mèimei.|Tôi không có anh trai, tôi có một em gái.
她是我的妈妈。|Tā shì wǒ de māma.|Bà ấy là mẹ của tôi.`},

{t:"Ngày tháng và giờ",w:`今天|jīn tiān|hôm nay|kim thiên
明天|míng tiān|ngày mai|minh thiên
昨天|zuó tiān|hôm qua|tạc thiên
天|tiān|ngày; trời|thiên
年|nián|năm|niên
月|yuè|tháng|nguyệt
号|hào|ngày (trong tháng); số|hiệu
星期|xīng qī|tuần, thứ|tinh kỳ
生日|shēng rì|sinh nhật|sinh nhật
现在|xiàn zài|bây giờ|hiện tại
点|diǎn|giờ|điểm
分|fēn|phút|phân
半|bàn|rưỡi, nửa|bán`,
g:"Thứ tự thời gian: lớn trước, nhỏ sau",
gh:`<p>Ngược với tiếng Việt: năm → tháng → ngày → thứ → giờ.</p>
<div class="pat">2026年11月19号 星期四 下午三点半</div>
<ul><li>Thứ: 星期一 (thứ Hai) … 星期六 (thứ Bảy), 星期天 (Chủ nhật).</li>
<li>Năm đọc từng chữ số: 2026年 = èr líng èr liù nián.</li>
<li>Câu chỉ thời gian không cần 是: 今天星期三.</li></ul>`,
ex:`今天几月几号？|Jīntiān jǐ yuè jǐ hào?|Hôm nay là ngày mấy tháng mấy?
今天星期三。|Jīntiān xīngqīsān.|Hôm nay là thứ Tư.
现在三点半。|Xiànzài sān diǎn bàn.|Bây giờ là ba giờ rưỡi.
你的生日是几月几号？|Nǐ de shēngrì shì jǐ yuè jǐ hào?|Sinh nhật bạn là ngày nào?`},

{t:"Ôn tuần 1: đây, kia, ở đâu",w:`这|zhè|này, đây|giá
那|nà|kia, đó|na
哪|nǎ|nào|na
谁|shéi|ai|thùy
哪儿|nǎr|ở đâu|na nhi
这儿|zhèr|ở đây|giá nhi
那儿|nàr|ở đó|na nhi
在|zài|ở, tại|tại
东西|dōng xi|đồ vật|đông tây
书|shū|sách|thư`,
g:"Câu hỏi có từ để hỏi",
gh:`<p>Với 什么, 谁, 哪儿, 几, 多少… <b>giữ nguyên trật tự câu</b>, chỉ thay từ cần hỏi bằng từ để hỏi. Không thêm 吗.</p>
<div class="pat">他是老师。→ 他是谁？　　书在这儿。→ 书在哪儿？</div>
<p>在 + nơi chốn = "ở đâu đó": 我在家 (tôi ở nhà).</p>`,
ex:`这是什么？|Zhè shì shénme?|Đây là cái gì?
那是我的书。|Nà shì wǒ de shū.|Kia là sách của tôi.
他是谁？|Tā shì shéi?|Anh ấy là ai?
你在哪儿？— 我在家。|Nǐ zài nǎr? — Wǒ zài jiā.|Bạn ở đâu? — Tôi ở nhà.`},

{t:"Động từ hằng ngày",w:`吃|chī|ăn|ngật
喝|hē|uống|hát
看|kàn|xem, nhìn, đọc|khán
听|tīng|nghe|thính
说|shuō|nói|thuyết
读|dú|đọc (thành tiếng)|độc
写|xiě|viết|tả
做|zuò|làm|tố
去|qù|đi|khứ
来|lái|đến|lai
学习|xué xí|học|học tập
工作|gōng zuò|làm việc; công việc|công tác
睡觉|shuì jiào|ngủ|thụy giác
汉语|Hàn yǔ|tiếng Hán|Hán ngữ`,
g:"Trật tự câu: Chủ ngữ + Thời gian + (Nơi chốn) + Động từ + Tân ngữ",
gh:`<p>Thời gian và nơi chốn đứng <b>trước</b> động từ, không đặt cuối câu như tiếng Việt.</p>
<div class="pat">我 + 今天 + 在家 + 学习 + 汉语。</div>
<p>Tiếng Việt: "Hôm nay tôi học tiếng Trung ở nhà" → tiếng Trung đưa "ở nhà" lên trước động từ.</p>
<p>去 + nơi chốn: 去中国 (đi Trung Quốc), không cần giới từ.</p>`,
ex:`我今天学习汉语。|Wǒ jīntiān xuéxí Hànyǔ.|Hôm nay tôi học tiếng Trung.
你喝什么？|Nǐ hē shénme?|Bạn uống gì?
他明天去中国。|Tā míngtiān qù Zhōngguó.|Ngày mai anh ấy đi Trung Quốc.
我在家看书。|Wǒ zài jiā kàn shū.|Tôi đọc sách ở nhà.`},

{t:"Ăn uống",w:`饭|fàn|cơm, bữa ăn|phạn
米饭|mǐ fàn|cơm trắng|mễ phạn
面条|miàn tiáo|mì sợi|miến điều
菜|cài|món ăn; rau|thái
水|shuǐ|nước|thủy
茶|chá|trà|trà
咖啡|kā fēi|cà phê|già phi
苹果|píng guǒ|quả táo|bình quả
好吃|hǎo chī|ngon|hảo ngật
饿|è|đói|ngạ

还是|hái shi|hay là (câu hỏi lựa chọn)|hoàn thị`,
g:"想 / 要 và câu hỏi lựa chọn 还是",
gh:`<p>想 + động từ = muốn làm gì (nhẹ nhàng). 要 + động từ/danh từ = muốn, cần (dứt khoát, hay dùng khi gọi món).</p>
<div class="pat">我想喝茶。　我要一杯咖啡。</div>
<p>Hỏi lựa chọn "A hay B": dùng <b>还是</b>, không thêm 吗.</p>
<div class="pat">你要米饭还是面条？</div>`,
ex:`我饿了，我想吃饭。|Wǒ è le, wǒ xiǎng chī fàn.|Tôi đói rồi, tôi muốn ăn cơm.
你要米饭还是面条？|Nǐ yào mǐfàn háishi miàntiáo?|Bạn muốn cơm hay mì?
这个菜很好吃！|Zhège cài hěn hǎochī!|Món này rất ngon!
我要一个苹果。|Wǒ yào yí gè píngguǒ.|Tôi muốn một quả táo.`},

{t:"Mua sắm và tiền",w:`买|mǎi|mua|mãi
卖|mài|bán|mại
钱|qián|tiền|tiền
块|kuài|đồng (tệ, khẩu ngữ)|khối
多少钱|duō shao qián|bao nhiêu tiền|đa thiểu tiền
贵|guì|đắt|quý
便宜|pián yi|rẻ|tiện nghi
衣服|yī fu|quần áo|y phục
商店|shāng diàn|cửa hàng|thương điếm
一点儿|yì diǎnr|một chút|nhất điểm nhi
太…了|tài … le|quá…|thái … liễu
吧|ba|nhé, đi (gợi ý, đề nghị)|ba`,
g:"Hỏi giá, 太…了 và 一点儿",
gh:`<p>Hỏi giá: <b>…多少钱？</b> Đơn vị khẩu ngữ: 块 (đồng), 毛 (hào).</p>
<div class="pat">太 + tính từ + 了 = quá…　(太贵了！)</div>
<p>Tính từ + <b>一点儿</b> = "hơn một chút" (dùng khi đề nghị, so sánh): 便宜一点儿吧 (rẻ hơn chút đi).</p>`,
ex:`这件衣服多少钱？|Zhè jiàn yīfu duōshao qián?|Bộ quần áo này bao nhiêu tiền?
一百块。— 太贵了！|Yìbǎi kuài. — Tài guì le!|100 tệ. — Đắt quá!
便宜一点儿吧。|Piányi yìdiǎnr ba.|Rẻ hơn chút đi.
我想去商店买东西。|Wǒ xiǎng qù shāngdiàn mǎi dōngxi.|Tôi muốn đến cửa hàng mua đồ.`},

{t:"Lượng từ",w:`本|běn|cuốn, quyển|bản
杯|bēi|cốc, ly|bôi

条|tiáo|con, chiếc (vật dài)|điều
瓶|píng|chai|bình
辆|liàng|chiếc (xe)|lượng
双|shuāng|đôi|song
猫|māo|con mèo|miêu
狗|gǒu|con chó|cẩu
车|chē|xe|xa`,
g:"Số + Lượng từ + Danh từ",
gh:`<p>Giống tiếng Việt "một <b>cuốn</b> sách", tiếng Trung bắt buộc có lượng từ giữa số (hoặc 这/那) và danh từ.</p>
<div class="pat">一本书　两杯咖啡　三只猫　这辆车　那张桌子</div>
<p>Không chắc dùng lượng từ nào thì dùng 个, người nghe vẫn hiểu.</p>`,
ex:`我有两只猫。|Wǒ yǒu liǎng zhī māo.|Tôi có hai con mèo.
我要三杯咖啡。|Wǒ yào sān bēi kāfēi.|Tôi muốn ba ly cà phê.
这本书是谁的？|Zhè běn shū shì shéi de?|Cuốn sách này là của ai?
那辆车很贵。|Nà liàng chē hěn guì.|Chiếc xe kia rất đắt.`},

{t:"Vị trí và phương hướng",w:`上|shàng|trên|thượng
下|xià|dưới|hạ
左|zuǒ|trái|tả
右|yòu|phải|hữu
前|qián|trước|tiền
后|hòu|sau|hậu
里|lǐ|trong|lý
外|wài|ngoài|ngoại
旁边|páng biān|bên cạnh|bàng biên
桌子|zhuō zi|cái bàn|trác tử
学校|xué xiào|trường học|học hiệu
医院|yī yuàn|bệnh viện|y viện
银行|yín háng|ngân hàng|ngân hàng
多|duō|nhiều|đa`,
g:"Vật + 在 + Nơi + Phương vị và câu tồn tại 有",
gh:`<p>Phương vị từ đứng <b>sau</b> danh từ: 桌子上 = "trên bàn" (ngược tiếng Việt).</p>
<div class="pat">书 + 在 + 桌子上。(Sách ở trên bàn)</div>
<p>Nói "ở đâu có gì" thì đưa nơi chốn lên đầu và dùng 有:</p>
<div class="pat">桌子上 + 有 + 一本书。(Trên bàn có một cuốn sách)</div>`,
ex:`书在桌子上。|Shū zài zhuōzi shang.|Sách ở trên bàn.
银行在学校旁边。|Yínháng zài xuéxiào pángbiān.|Ngân hàng ở bên cạnh trường học.
学校里有很多人。|Xuéxiào li yǒu hěn duō rén.|Trong trường có rất nhiều người.
医院在左边还是右边？|Yīyuàn zài zuǒbian háishi yòubian?|Bệnh viện ở bên trái hay bên phải?`},

{t:"Một ngày của tôi",w:`早上|zǎo shang|buổi sáng|tảo thượng
中午|zhōng wǔ|buổi trưa|trung ngọ
下午|xià wǔ|buổi chiều|hạ ngọ
晚上|wǎn shang|buổi tối|vãn thượng
每天|měi tiān|mỗi ngày|mỗi thiên
起床|qǐ chuáng|thức dậy|khởi sàng
上班|shàng bān|đi làm|thượng ban
下班|xià bān|tan làm|hạ ban
上课|shàng kè|lên lớp|thượng khóa

以前|yǐ qián|trước khi, trước đây|dĩ tiền`,
g:"什么时候 và …的时候",
gh:`<p>Hỏi "khi nào": <b>什么时候</b> đặt trước động từ.</p>
<div class="pat">你什么时候上课？</div>
<p>"Khi/lúc làm gì": mệnh đề + <b>的时候</b>. "Sau khi": mệnh đề + 以后.</p>
<div class="pat">吃饭的时候　下班以后</div>`,
ex:`你每天几点起床？|Nǐ měitiān jǐ diǎn qǐchuáng?|Mỗi ngày bạn dậy lúc mấy giờ?
我早上七点起床。|Wǒ zǎoshang qī diǎn qǐchuáng.|Tôi dậy lúc 7 giờ sáng.
下班以后我去学习汉语。|Xiàbān yǐhòu wǒ qù xuéxí Hànyǔ.|Tan làm xong tôi đi học tiếng Trung.
你什么时候上课？|Nǐ shénme shíhou shàngkè?|Khi nào bạn lên lớp?`},

{t:"Ôn tuần 2: 会, 能, 可以",w:`会|huì|biết (do học mà có)|hội
能|néng|có thể (có khả năng)|năng
可以|kě yǐ|có thể, được phép|khả dĩ
开车|kāi chē|lái xe|khai xa
游泳|yóu yǒng|bơi|du vịnh
唱歌|chàng gē|hát|xướng ca
跳舞|tiào wǔ|nhảy múa|khiêu vũ
汉字|Hàn zì|chữ Hán|Hán tự
一下|yí xià|thử, một chút (sau động từ)|nhất hạ
请|qǐng|mời; xin vui lòng|thỉnh`,
g:"Ba động từ năng nguyện: 会 · 能 · 可以",
gh:`<ul><li><b>会</b>: kỹ năng học được. 我会游泳 (tôi biết bơi).</li>
<li><b>能</b>: có khả năng/điều kiện. 我今天不能去 (hôm nay tôi không đi được).</li>
<li><b>可以</b>: được phép. 这儿可以坐吗？(ngồi đây được không?)</li></ul>
<div class="pat">Chủ ngữ + 会/能/可以 + Động từ</div>
<p>Động từ + <b>一下</b> làm câu mềm hơn: 看一下 (xem một chút).</p>`,
ex:`我会说汉语。|Wǒ huì shuō Hànyǔ.|Tôi biết nói tiếng Trung.
我今天不能去。|Wǒ jīntiān bù néng qù.|Hôm nay tôi không thể đi.
我可以看一下吗？|Wǒ kěyǐ kàn yíxià ma?|Tôi xem một chút được không?
请你唱一首歌吧！|Qǐng nǐ chàng yì shǒu gē ba!|Mời bạn hát một bài nhé!`},

怎么|zěn me|thế nào, làm sao|chẩm ma`,
g:"怎么 + Động từ và câu khoảng cách 离",
gh:`<p>Hỏi cách thức: <b>怎么 + động từ</b>. Trả lời bằng 坐 + phương tiện + 去.</p>
<div class="pat">你怎么去？→ 我坐地铁去。</div>
<p>Khoảng cách: <b>A 离 B + 远/近</b>.</p>
<div class="pat">机场离这儿很远。(Sân bay cách đây rất xa)</div>`,
ex:`你怎么去学校？|Nǐ zěnme qù xuéxiào?|Bạn đi đến trường bằng gì?
我坐地铁去。|Wǒ zuò dìtiě qù.|Tôi đi tàu điện ngầm.
机场离这儿很远。|Jīchǎng lí zhèr hěn yuǎn.|Sân bay cách đây rất xa.
银行很近，我们走去吧。|Yínháng hěn jìn, wǒmen zǒu qù ba.|Ngân hàng gần lắm, mình đi bộ nhé.`},

冬天|dōng tiān|mùa đông|đông thiên`,
g:"了 cuối câu: tình huống đã thay đổi",
gh:`<p>了 đặt cuối câu báo hiệu một trạng thái mới xuất hiện, giống "rồi" trong tiếng Việt.</p>
<div class="pat">下雨了！(Mưa rồi!)　天冷了。(Trời lạnh rồi)</div>
<p>Hỏi thời tiết: 天气怎么样？ Nhiệt độ: 三十度 (30 độ).</p>`,
ex:`明天天气怎么样？|Míngtiān tiānqì zěnmeyàng?|Thời tiết ngày mai thế nào?
今天很热，三十五度。|Jīntiān hěn rè, sānshíwǔ dù.|Hôm nay rất nóng, 35 độ.

我喜欢秋天，不冷也不热。|Wǒ xǐhuan qiūtiān, bù lěng yě bú rè.|Tôi thích mùa thu, không lạnh cũng không nóng.`},

{t:"Sở thích",w:`喜欢|xǐ huan|thích|hỉ hoan

g:"喜欢 + Động từ, 一起 + Động từ + 吧",
gh:`<p>喜欢 có thể đi với danh từ hoặc cả cụm động từ.</p>
<div class="pat">我喜欢音乐。　我喜欢听音乐。</div>
<p>Rủ ai làm gì: <b>我们一起 + động từ + 吧！</b></p>`,
ex:`我喜欢听音乐。|Wǒ xǐhuan tīng yīnyuè.|Tôi thích nghe nhạc.

g:"有点儿 + Tính từ khác với Tính từ + 一点儿",
gh:`<p><b>有点儿</b> đứng <b>trước</b> tính từ, mang ý phàn nàn: 有点儿贵 (hơi đắt).</p>
<p><b>一点儿</b> đứng <b>sau</b> tính từ, dùng khi so sánh/đề nghị: 便宜一点儿 (rẻ hơn chút).</p>
<div class="pat">我有点儿不舒服。　你应该多休息。</div>`,
ex:`我有点儿不舒服。|Wǒ yǒudiǎnr bù shūfu.|Tôi hơi khó chịu trong người.

你应该去医院看医生。|Nǐ yīnggāi qù yīyuàn kàn yīshēng.|Bạn nên đến bệnh viện khám bác sĩ.
多喝水，多休息。|Duō hē shuǐ, duō xiūxi.|Uống nhiều nước, nghỉ ngơi nhiều.`},

gh:`<p>在 hoặc 正在 đứng trước động từ = "đang". Có thể thêm 呢 cuối câu cho tự nhiên.</p>
<div class="pat">我在打电话呢。　他正在上网。</div>
<p>Phân biệt: <b>知道</b> = biết thông tin; <b>会</b> = biết làm (kỹ năng).</p>`,
ex:`你在做什么呢？|Nǐ zài zuò shénme ne?|Bạn đang làm gì thế?
我正在打电话。|Wǒ zhèngzài dǎ diànhuà.|Tôi đang gọi điện.
请等一下，我在找手机。|Qǐng děng yíxià, wǒ zài zhǎo shǒujī.|Đợi chút nhé, tôi đang tìm điện thoại.
我不知道，你问老师吧。|Wǒ bù zhīdào, nǐ wèn lǎoshī ba.|Tôi không biết, bạn hỏi thầy đi.`},

gh:`<p>了 sau động từ cho biết hành động đã hoàn thành.</p>

<p>Phủ định: <b>没(有) + động từ</b> và <b>bỏ 了</b>. "Chưa" = 还没.</p>

ex:`你吃饭了吗？|Nǐ chī fàn le ma?|Bạn ăn cơm chưa?

我刚才见了一个朋友。|Wǒ gāngcái jiàn le yí gè péngyou.|Vừa nãy tôi gặp một người bạn.`},

{t:"Ôn tuần 3: trải nghiệm với 过",w:`过|guo|đã từng|quá
北京|Běi jīng|Bắc Kinh|Bắc Kinh

g:"Động từ + 过: đã từng trải qua",
gh:`<p>过 sau động từ nói về kinh nghiệm trong quá khứ (đã từng).</p>
<div class="pat">我去过北京。　你吃过烤鸭吗？</div>
<p>Phủ định: <b>没(有) + động từ + 过</b> (giữ 过). Nhấn mạnh: 从来没…过 (chưa bao giờ).</p>

<p>哥哥比我高。Không dùng 很 trong câu 比 (không nói 比我很高), muốn nhấn mạnh dùng 更 hoặc 多了.</p>
<div class="pat">A 跟 B 一样 (+ Tính từ)　　A 没有 B + Tính từ</div>

<p>Nếu có tân ngữ, <b>lặp lại động từ</b> (hoặc đưa tân ngữ lên trước):</p>
<div class="pat">你说汉语说得很流利。= 你汉语说得很流利。</div>
<p>Phủ định đặt 不 trước tính từ: 他跑得不快.</p>`,

gh:`<div class="pat">因为…，所以…　　虽然…，但是…　　如果…，就…</div>
<ul><li>就 đứng <b>sau chủ ngữ</b> của vế sau: 如果你去，我就去.</li>

<li>Kể trình tự: 先… 然后… (trước… sau đó…).</li></ul>`,

g:"Nhờ vả lịch sự",
gh:`<p>Bắt đầu câu hỏi đường bằng <b>请问</b> (xin hỏi). Nhờ ai làm gì: <b>能不能/可以…吗</b>.</p>

gh:`<p>Gắn một từ chỉ kết quả ngay sau động từ:</p>

gh:`<p>Khi sự việc <b>đã xảy ra</b> và người nói muốn nhấn mạnh <b>thời gian, nơi chốn, cách thức hoặc người làm</b>, đặt phần đó giữa 是 và 的.</p>
<div class="pat">Chủ ngữ + 是 + (thời gian / nơi / cách thức) + Động từ + 的</div>
<ul><li>是 có thể lược bỏ trong khẩu ngữ, nhưng 的 thì không.</li>
<li>Phủ định: 不是…的 (我不是坐飞机来的).</li></ul>`,
ex:`你是什么时候来中国的？|Nǐ shì shénme shíhou lái Zhōngguó de?|Bạn đến Trung Quốc khi nào?
我是在河内出生的。|Wǒ shì zài Hénèi chūshēng de.|Tôi sinh ra ở Hà Nội.
他们是坐火车来的。|Tāmen shì zuò huǒchē lái de.|Họ đến bằng tàu hỏa.
我是大学毕业以后去留学的。|Wǒ shì dàxué bìyè yǐhòu qù liúxué de.|Tôi đi du học sau khi tốt nghiệp đại học.`},

gh:`<p>Nêu một trường hợp cực đoan để nhấn mạnh: "ngay cả… cũng…".</p>

中午我打了一个电话。|Zhōngwǔ wǒ dǎ le yí gè diànhuà.|Buổi trưa tôi gọi một cuộc điện thoại.
下午我已经做完了工作。|Xiàwǔ wǒ yǐjīng zuò wán le gōngzuò.|Buổi chiều tôi đã làm xong công việc.
晚上我回家了，我很累。|Wǎnshang wǒ huí jiā le, wǒ hěn lèi.|Buổi tối tôi về nhà, tôi rất mệt.
我十点睡觉了。|Wǒ shí diǎn shuìjiào le.|Tôi đi ngủ lúc mười giờ.`],
21:["Chuyến đi Bắc Kinh",`上个星期我和朋友去了北京。|Shàng ge xīngqī wǒ hé péngyou qù le Běijīng.|Tuần trước tôi và bạn đã đi Bắc Kinh.
我们坐飞机去，机场离城市有点儿远。|Wǒmen zuò fēijī qù, jīchǎng lí chéngshì yǒudiǎnr yuǎn.|Chúng tôi đi máy bay, sân bay cách thành phố hơi xa.
北京的冬天很冷，下雪了！|Běijīng de dōngtiān hěn lěng, xià xuě le!|Mùa đông Bắc Kinh rất lạnh, tuyết rơi rồi!
我们去了长城，也吃了烤鸭。|Wǒmen qù le Chángchéng, yě chī le kǎoyā.|Chúng tôi đã đi Trường Thành, cũng đã ăn vịt quay.
烤鸭很好吃，我很喜欢。|Kǎoyā hěn hǎochī, wǒ hěn xǐhuan.|Vịt quay rất ngon, tôi rất thích.
回家以后，我感冒了，有点儿不舒服。|Huí jiā yǐhòu, wǒ gǎnmào le, yǒudiǎnr bù shūfu.|Về nhà xong, tôi bị cảm, hơi khó chịu.`],
22:["Anh em nhà tôi",`我哥哥比我高，也比我大三岁。|Wǒ gēge bǐ wǒ gāo, yě bǐ wǒ dà sān suì.|Anh trai tôi cao hơn tôi, cũng lớn hơn tôi ba tuổi.
他的自行车比我的新。|Tā de zìxíngchē bǐ wǒ de xīn.|Xe đạp của anh ấy mới hơn của tôi.
我的书比他的多。|Wǒ de shū bǐ tā de duō.|Sách của tôi nhiều hơn của anh ấy.
我妹妹跟我一样高。|Wǒ mèimei gēn wǒ yíyàng gāo.|Em gái tôi cao bằng tôi.
她的汉语比我的更好。|Tā de Hànyǔ bǐ wǒ de gèng hǎo.|Tiếng Trung của em ấy còn giỏi hơn của tôi.
在我们家，妈妈做的菜最好吃。|Zài wǒmen jiā, māma zuò de cài zuì hǎochī.|Ở nhà tôi, món mẹ nấu là ngon nhất.`],
23:["Bạn tôi Tiểu Vương",`我的朋友小王很认真。|Wǒ de péngyou Xiǎo Wáng hěn rènzhēn.|Bạn tôi là Tiểu Vương rất chăm chỉ.
他每天起得很早。|Tā měitiān qǐ de hěn zǎo.|Ngày nào anh ấy cũng dậy rất sớm.
他跑得非常快。|Tā pǎo de fēicháng kuài.|Anh ấy chạy cực kỳ nhanh.
他说汉语说得很流利。|Tā shuō Hànyǔ shuō de hěn liúlì.|Anh ấy nói tiếng Trung rất lưu loát.
他写汉字写得真好看。|Tā xiě Hànzì xiě de zhēn hǎokàn.|Anh ấy viết chữ Hán đẹp thật.
我也要努力学习！|Wǒ yě yào nǔlì xuéxí!|Tôi cũng phải cố gắng học!`],
24:["Một ngày mưa",`因为今天下雨，所以我没去学校。|Yīnwèi jīntiān xià yǔ, suǒyǐ wǒ méi qù xuéxiào.|Vì hôm nay trời mưa nên tôi không đến trường.
虽然在家，但是我很忙。|Suīrán zài jiā, dànshì wǒ hěn máng.|Tuy ở nhà nhưng tôi rất bận.
我先学习汉语，然后看书。|Wǒ xiān xuéxí Hànyǔ, ránhòu kàn shū.|Tôi học tiếng Trung trước, sau đó đọc sách.
下午朋友打电话问我：“你想去看电影吗？”|Xiàwǔ péngyou dǎ diànhuà wèn wǒ: “Nǐ xiǎng qù kàn diànyǐng ma?”|Buổi chiều bạn gọi điện hỏi tôi: “Cậu muốn đi xem phim không?”
我说：“如果明天不下雨，我们就去吧。”|Wǒ shuō: “Rúguǒ míngtiān bú xià yǔ, wǒmen jiù qù ba.”|Tôi nói: “Nếu mai không mưa thì mình đi nhé.”
看电影或者喝咖啡，我都喜欢。|Kàn diànyǐng huòzhě hē kāfēi, wǒ dōu xǐhuan.|Xem phim hay uống cà phê, tôi đều thích.`],
25:["Đến khách sạn",`我们到了上海，先去宾馆。|Wǒmen dào le Shànghǎi, xiān qù bīnguǎn.|Chúng tôi đến Thượng Hải, việc đầu tiên là về khách sạn.
我说：“你好，我预订了一个房间。”|Wǒ shuō: “Nǐ hǎo, wǒ yùdìng le yí gè fángjiān.”|Tôi nói: “Chào chị, tôi đã đặt trước một phòng.”
她说：“好的，护照呢？”|Tā shuō: “Hǎo de, hùzhào ne?”|Cô ấy nói: “Vâng, hộ chiếu của anh đâu ạ?”
她很快就帮我们准备好了房间。|Tā hěn kuài jiù bāng wǒmen zhǔnbèi hǎo le fángjiān.|Cô ấy nhanh chóng chuẩn bị xong phòng cho chúng tôi.
房间不大，但是很好。|Fángjiān bú dà, dànshì hěn hǎo.|Phòng không lớn nhưng rất tốt.
我问：“请问，地铁站离这儿远吗？”|Wǒ wèn: “Qǐngwèn, dìtiě zhàn lí zhèr yuǎn ma?”|Tôi hỏi: “Xin hỏi, ga tàu điện ngầm có xa đây không?”`],
26:["Ở công ty",`我在一家公司工作。|Wǒ zài yì jiā gōngsī gōngzuò.|Tôi làm việc ở một công ty.
我的同事都很好。|Wǒ de tóngshì dōu hěn hǎo.|Đồng nghiệp của tôi đều rất tốt.
今天公司有一个会议。|Jīntiān gōngsī yǒu yí gè huìyì.|Hôm nay công ty có một cuộc họp.
经理说得很快，我没听懂。|Jīnglǐ shuō de hěn kuài, wǒ méi tīng dǒng.|Giám đốc nói rất nhanh, tôi nghe không hiểu.
会议以后，我问同事：“这个问题是什么意思？”|Huìyì yǐhòu, wǒ wèn tóngshì: “Zhège wèntí shì shénme yìsi?”|Họp xong, tôi hỏi đồng nghiệp: “Vấn đề này nghĩa là gì?”
同事告诉我以后，我就明白了。|Tóngshì gàosu wǒ yǐhòu, wǒ jiù míngbai le.|Đồng nghiệp giải thích xong, tôi hiểu ngay.`],
27:["Thi xong rồi",`明天有考试，我有点儿担心。|Míngtiān yǒu kǎoshì, wǒ yǒudiǎnr dānxīn.|Ngày mai có bài thi, tôi hơi lo.
朋友说：“别担心，你一定可以！”|Péngyou shuō: “Bié dānxīn, nǐ yídìng kěyǐ!”|Bạn nói: “Đừng lo, cậu nhất định làm được!”
考试以后，我觉得不太难。|Kǎoshì yǐhòu, wǒ juéde bú tài nán.|Thi xong, tôi thấy không khó lắm.
老师说：“你做得很好！”|Lǎoshī shuō: “Nǐ zuò de hěn hǎo!”|Thầy nói: “Em làm rất tốt!”
我非常开心，晚上和朋友一起去吃饭。|Wǒ fēicháng kāixīn, wǎnshang hé péngyou yìqǐ qù chī fàn.|Tôi vô cùng vui, buổi tối cùng bạn đi ăn.
我希望明年去中国学习汉语。|Wǒ xīwàng míngnián qù Zhōngguó xuéxí Hànyǔ.|Tôi hy vọng năm sau sang Trung Quốc học tiếng Trung.`],
28:["Bốn tuần học tiếng Trung",`虽然我只学了四个星期汉语，但是我觉得很有意思。|Suīrán wǒ zhǐ xué le sì ge xīngqī Hànyǔ, dànshì wǒ juéde hěn yǒu yìsi.|Tuy tôi mới học tiếng Trung bốn tuần, nhưng tôi thấy rất thú vị.
我的老师说得很快，但是我都听懂了。|Wǒ de lǎoshī shuō de hěn kuài, dànshì wǒ dōu tīng dǒng le.|Thầy giáo nói rất nhanh, nhưng tôi đều nghe hiểu.
因为我每天都练习，所以我比以前说得更流利。|Yīnwèi wǒ měitiān dōu liànxí, suǒyǐ wǒ bǐ yǐqián shuō de gèng liúlì.|Vì ngày nào tôi cũng luyện tập nên tôi nói lưu loát hơn trước.
如果明年有机会，我就去中国旅游。|Rúguǒ míngnián yǒu jīhuì, wǒ jiù qù Zhōngguó lǚyóu.|Nếu năm sau có cơ hội, tôi sẽ đi du lịch Trung Quốc.
我已经把护照准备好了！|Wǒ yǐjīng bǎ hùzhào zhǔnbèi hǎo le!|Tôi đã chuẩn bị xong hộ chiếu rồi!`],
31:["Câu chuyện của bố",`我爸爸是在河内出生的。|Wǒ bàba shì zài Hénèi chūshēng de.|Bố tôi sinh ra ở Hà Nội.
他是二十二岁大学毕业的。|Tā shì èrshí'èr suì dàxué bìyè de.|Bố tốt nghiệp đại học năm 22 tuổi.
年轻的时候，他在北京留学了两年。|Niánqīng de shíhou, tā zài Běijīng liúxué le liǎng nián.|Hồi trẻ, bố đã du học ở Bắc Kinh hai năm.
他和我妈妈是在北京认识的。|Tā hé wǒ māma shì zài Běijīng rènshi de.|Bố và mẹ tôi quen nhau ở Bắc Kinh.
他们是坐飞机回越南结婚的。|Tāmen shì zuò fēijī huí Yuènán jiéhūn de.|Họ đi máy bay về Việt Nam để kết hôn.
我小时候，爸爸经常给我讲他留学的故事。|Wǒ xiǎo shíhou, bàba jīngcháng gěi wǒ jiǎng tā liúxué de gùshi.|Hồi nhỏ, bố thường kể cho tôi nghe chuyện du học của bố.`],
32:["Đón bạn ở sân bay",`今天我的朋友从越南来北京。|Jīntiān wǒ de péngyou cóng Yuènán lái Běijīng.|Hôm nay bạn tôi từ Việt Nam đến Bắc Kinh.
我去机场接他。|Wǒ qù jīchǎng jiē tā.|Tôi ra sân bay đón bạn.
他一出来，我就跑过去帮他拿行李。|Tā yì chūlai, wǒ jiù pǎo guòqu bāng tā ná xíngli.|Bạn vừa đi ra, tôi liền chạy lại giúp bạn cầm hành lý.
我们坐地铁回家。|Wǒmen zuò dìtiě huí jiā.|Chúng tôi đi tàu điện ngầm về nhà.
我家在十二层，我们坐电梯上去。|Wǒ jiā zài shí'èr céng, wǒmen zuò diàntī shàngqu.|Nhà tôi ở tầng 12, chúng tôi đi thang máy lên.
进了房间，他说：“你家真漂亮！”|Jìn le fángjiān, tā shuō: “Nǐ jiā zhēn piàoliang!”|Vào phòng, bạn nói: “Nhà cậu đẹp thật!”`],
33:["Lớp học tiếng Trung",`我们的汉语老师说话很快。|Wǒmen de Hànyǔ lǎoshī shuōhuà hěn kuài.|Thầy dạy tiếng Trung của chúng tôi nói rất nhanh.
刚开始的时候，我听不懂，也看不清楚黑板上的字。|Gāng kāishǐ de shíhou, wǒ tīng bu dǒng, yě kàn bu qīngchu hēibǎn shang de zì.|Lúc mới bắt đầu, tôi nghe không hiểu, cũng nhìn không rõ chữ trên bảng.
我很着急，就去问老师有什么办法。|Wǒ hěn zháojí, jiù qù wèn lǎoshī yǒu shénme bànfǎ.|Tôi rất sốt ruột, liền đi hỏi thầy có cách nào không.
老师说：“别着急，多听多练习，你一定能听懂。”|Lǎoshī shuō: “Bié zháojí, duō tīng duō liànxí, nǐ yídìng néng tīng dǒng.”|Thầy nói: “Đừng sốt ruột, nghe nhiều luyện nhiều, em nhất định sẽ nghe hiểu.”
现在我坐在前边，黑板上的字都看得清楚了。|Xiànzài wǒ zuò zài qiánbian, hēibǎn shang de zì dōu kàn de qīngchu le.|Bây giờ tôi ngồi ở phía trước, chữ trên bảng đều nhìn rõ rồi.
老师说的话，我现在也能听懂了。|Lǎoshī shuō de huà, wǒ xiànzài yě néng tīng dǒng le.|Lời thầy nói, bây giờ tôi cũng nghe hiểu được rồi.`],
34:["Thành phố của tôi",`我的城市越来越大，人也越来越多。|Wǒ de chéngshì yuè lái yuè dà, rén yě yuè lái yuè duō.|Thành phố của tôi ngày càng lớn, người cũng ngày càng đông.
以前这里没有地铁，现在有三条了。|Yǐqián zhèlǐ méiyǒu dìtiě, xiànzài yǒu sān tiáo le.|Trước đây ở đây không có tàu điện ngầm, bây giờ đã có ba tuyến.
环境也有了很大的变化。|Huánjìng yě yǒu le hěn dà de biànhuà.|Môi trường cũng có nhiều thay đổi lớn.
很多人开始锻炼身体，越来越健康。|Hěn duō rén kāishǐ duànliàn shēntǐ, yuè lái yuè jiànkāng.|Nhiều người bắt đầu tập thể dục, ngày càng khỏe mạnh.
我对这个城市越来越感兴趣。|Wǒ duì zhège chéngshì yuè lái yuè gǎn xìngqù.|Tôi ngày càng có hứng thú với thành phố này.
我在这里越住越喜欢。|Wǒ zài zhèlǐ yuè zhù yuè xǐhuan.|Tôi càng sống ở đây càng thích.`],
35:["Thói quen tập thể dục",`去年我越来越胖，所以我决定每天锻炼身体。|Qùnián wǒ yuè lái yuè pàng, suǒyǐ wǒ juédìng měitiān duànliàn shēntǐ.|Năm ngoái tôi ngày càng béo, nên tôi quyết định ngày nào cũng tập thể dục.
每天早上起床以后，我马上去跑步。|Měitiān zǎoshang qǐchuáng yǐhòu, wǒ mǎshàng qù pǎobù.|Mỗi sáng ngủ dậy xong, tôi đi chạy bộ ngay.
开始的时候很累，但是现在我已经习惯了。|Kāishǐ de shíhou hěn lèi, dànshì xiànzài wǒ yǐjīng xíguàn le.|Lúc đầu rất mệt, nhưng bây giờ tôi đã quen rồi.
我的身体越来越健康，也瘦了五公斤。|Wǒ de shēntǐ yuè lái yuè jiànkāng, yě shòu le wǔ gōngjīn.|Sức khỏe của tôi ngày càng tốt, tôi cũng gầy đi năm cân.
医生说，只要我每天坚持，就会越来越好。|Yīshēng shuō, zhǐyào wǒ měitiān jiānchí, jiù huì yuè lái yuè hǎo.|Bác sĩ nói chỉ cần tôi kiên trì mỗi ngày thì sẽ ngày càng tốt.
现在我的朋友也跟我一起锻炼。|Xiànzài wǒ de péngyou yě gēn wǒ yìqǐ duànliàn.|Bây giờ bạn tôi cũng tập cùng tôi.`],
36:["Cuối tuần của tôi",`周末我一般在家休息。|Zhōumò wǒ yìbān zài jiā xiūxi.|Cuối tuần tôi thường ở nhà nghỉ ngơi.
除了休息以外，我还经常看电影、听音乐。|Chúle xiūxi yǐwài, wǒ hái jīngcháng kàn diànyǐng, tīng yīnyuè.|Ngoài nghỉ ngơi, tôi còn thường xem phim, nghe nhạc.
有时候我跟朋友去参加比赛。|Yǒu shíhou wǒ gēn péngyou qù cānjiā bǐsài.|Thỉnh thoảng tôi cùng bạn đi tham gia thi đấu.
上个周末，除了我以外，我的朋友都去爬山了。|Shàng ge zhōumò, chúle wǒ yǐwài, wǒ de péngyou dōu qù pá shān le.|Cuối tuần trước, trừ tôi ra, bạn bè tôi đều đi leo núi.
因为我感冒了，只能在家看节目。|Yīnwèi wǒ gǎnmào le, zhǐ néng zài jiā kàn jiémù.|Vì tôi bị cảm nên chỉ có thể ở nhà xem chương trình.
这个周末我一定要和他们一起去。|Zhège zhōumò wǒ yídìng yào hé tāmen yìqǐ qù.|Cuối tuần này tôi nhất định phải đi cùng họ.`],
37:["Người bạn yêu văn hóa Trung Quốc",`我的朋友小王特别喜欢中国文化。|Wǒ de péngyou Xiǎo Wáng tèbié xǐhuan Zhōngguó wénhuà.|Bạn tôi là Tiểu Vương đặc biệt thích văn hóa Trung Quốc.
他一直在学习中国历史，连很难的书都看得懂。|Tā yìzhí zài xuéxí Zhōngguó lìshǐ, lián hěn nán de shū dōu kàn de dǒng.|Anh ấy luôn học lịch sử Trung Quốc, ngay cả sách rất khó cũng đọc hiểu.
他甚至会用汉语讲故事。|Tā shènzhì huì yòng Hànyǔ jiǎng gùshi.|Anh ấy thậm chí biết kể chuyện bằng tiếng Trung.
我问他：“你是怎么学的？”|Wǒ wèn tā: “Nǐ shì zěnme xué de?”|Tôi hỏi: “Bạn học bằng cách nào?”

const TM={"ā":["a",1],"á":["a",2],"ǎ":["a",3],"à":["a",4],"ē":["e",1],"é":["e",2],"ě":["e",3],"è":["e",4],"ī":["i",1],"í":["i",2],"ǐ":["i",3],"ì":["i",4],"ō":["o",1],"ó":["o",2],"ǒ":["o",3],"ò":["o",4],"ū":["u",1],"ú":["u",2],"ǔ":["u",3],"ù":["u",4],"ǖ":["ü",1],"ǘ":["ü",2],"ǚ":["ü",3],"ǜ":["ü",4]};
const MK={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
function toneOf(s){for(const c of s.toLowerCase()){if(TM[c])return TM[c][1]}return 5}
function baseOf(s){return [...s].map(c=>TM[c.toLowerCase()]?(c===c.toLowerCase()?TM[c][0]:TM[c.toLowerCase()][0].toUpperCase()):c).join("")}
function mark(base,t){
  if(t===5)return base;const low=base.toLowerCase();let idx=-1;
  if(low.includes("a"))idx=low.indexOf("a");else if(low.includes("e"))idx=low.indexOf("e");else if(low.includes("ou"))idx=low.indexOf("o");
  else{for(let i=low.length-1;i>=0;i--){if("iouü".includes(low[i])){idx=i;break}}}
  if(idx<0)return base;const ch=low[idx];const m=MK[ch][t-1];
  return base.slice(0,idx)+(base[idx]!==ch?m.toUpperCase():m)+base.slice(idx+1);
}
function pyHTML(p){return p.split(" ").map(s=>`<span class="t${toneOf(s)}">${s}</span>`).join("")}
function pyPlain(p){return p.split(" ").join("")}
function pyVariants(p,n){
  const syl=p.split(" ").filter(s=>s!=="…");const out=new Set();let guard=0;
  while(out.size<n&&guard++<80){
    const s=[...p.split(" ")];const idxs=s.map((x,i)=>x==="…"?-1:i).filter(i=>i>=0);
    const k=idxs[Math.floor(Math.random()*idxs.length)];const cur=toneOf(s[k]);
    const opts=[1,2,3,4].filter(t=>t!==cur);s[k]=mark(baseOf(s[k]),opts[Math.floor(Math.random()*opts.length)]);
    if(guard>30&&idxs.length>1){const k2=idxs.find(i=>i!==k);const c2=toneOf(s[k2]);s[k2]=mark(baseOf(s[k2]),[1,2,3,4].filter(t=>t!==c2)[guard%3])}
    const v=s.join(" ");if(v!==p)out.add(v);
  }
  return [...out];
}

  ${WEEKS.map(wk=>{const ds=DAYS.filter(d=>d.week===wk.n);const dn=ds.filter(d=>S.done[d.n]).length;

      <small>${d.words.length?d.words.length+" từ"+(stepCount(d.n)?" · "+stepCount(d.n)+"/5 bước":""):d.final?"Kiểm tra":"Tổng ôn"}${S.best[d.n]!=null?" · cao nhất "+S.best[d.n]+"%":""}</small></a>`).join("")}</div></section>`}).join("")}${mockHTML()}`;
}

let dayTab="vocab";
function viewDay(n){
  const d=DAYS[n-1];if(!d){location.hash="#plan";return}

  if(!tabs.find(t=>t[0]===dayTab))dayTab="vocab";
  if(d.words.length&&(dayTab==="vocab"||dayTab==="gram"))markStep(n,dayTab);
  app.innerHTML=`<section class="dayhead">
    <div class="row"><a href="#plan" class="muted" style="text-decoration:none;font-weight:600">← Lộ trình</a><span class="spacer"></span>
      ${n>1?`<a class="btn ghost" href="#day-${n-1}">Ngày ${n-1}</a>`:""}${n<DAYS.length?`<a class="btn ghost" href="#day-${n+1}">Ngày ${n+1}</a>`:""}</div>
    <div class="eyebrow">Ngày ${n} · Chặng ${d.week} · ${WEEKS[d.week-1].name}</div>
    <h2 style="font-size:1.7rem">${esc(d.t)}</h2>
    ${S.done[n]?`<div class="banner"><span class="seal">成</span><div><b>Đã hoàn thành</b><div class="muted">Điểm cao nhất ${S.best[n]}%. ${n<DAYS.length?`<a href="#day-${n+1}">Sang Ngày ${n+1} →</a>`:""}</div></div></div>`:""}
    <div class="subtabs" role="toolbar">${tabs.map(([k,l])=>`<button aria-pressed="${dayTab===k}" data-tab="${k}">${l}${stepDone(n,k)?` <span style="color:var(--good)" aria-label="đã xong">✓</span>`:""}</button>`).join("")}</div>
  </section><section id="dayBody" class="sect"></section>`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{dayTab=b.dataset.tab;viewDay(n)});
  const body=$("#dayBody");
  if(dayTab==="vocab"){
    if(d.words.length){
      body.innerHTML=`<div class="row"><button class="btn" id="playAll">${SPK} Nghe lần lượt cả bài</button><span class="muted" style="font-size:.86rem">Bấm vào thẻ để nghe từng từ. Âm Hán Việt giúp bạn đoán nghĩa nhanh hơn.</span></div>
      <div class="row" style="font-size:.9rem"><span class="eyebrow">Tự kiểm tra</span><label class="row" style="gap:6px"><input type="checkbox" id="hidePyW" ${coverPref("py")?"checked":""}> Che pinyin</label><label class="row" style="gap:6px"><input type="checkbox" id="hideMW" ${coverPref("m")?"checked":""}> Che nghĩa</label></div>
      <div class="words ${coverPref("py")?"hide-py":""} ${coverPref("m")?"hide-m":""}" id="wordGrid">${d.words.map(w=>`<button class="word" data-say="${esc(w.h)}"><span class="spk">${SPK}</span><span class="h">${w.h}</span><span class="py">${pyHTML(w.p)}</span><span class="m">${esc(w.m)}</span>${noteHTML(w.h)}${w.v?`<span class="hv">${esc(w.v)}</span>`:""}</button>`).join("")}</div>
      ${readingHTML(d)}${cultureHTML(d.n)}${mkHTML(d)}<div class="row"><button class="btn primary" data-go="gram">Tiếp: Ngữ pháp →</button></div>`;
      $("#playAll").onclick=playSeq(d.words.map(w=>w.h));wireReading(d);
      const wg=$("#wordGrid");const setC=(k,cls,el)=>{wg.classList.toggle(cls,el.checked);wg.querySelectorAll(".word.shown").forEach(x=>x.classList.remove("shown"));try{localStorage.setItem("hanngu30.cover."+k,el.checked?"1":"")}catch(x){}};
      $("#hidePyW").onchange=e=>setC("py","hide-py",e.target);$("#hideMW").onchange=e=>setC("m","hide-m",e.target);
      wg.addEventListener("click",e=>{const w=e.target.closest(".word");if(w)w.classList.add("shown")});
    }else if(d.review){
      body.innerHTML=`<div class="card gram">${d.gh}</div><h3>Hội thoại: Hẹn gặp ở Bắc Kinh</h3>

      $("#hidePy").onchange=e=>$("#dlg").querySelectorAll(".p").forEach(x=>x.style.visibility=e.target.checked?"hidden":"visible");
      $("#playDl").onclick=playSeq(DIALOG.split("\n").map(l=>l.split("|")[1]));

      body.innerHTML=`<div class="card gram"><h3>${esc(d.g)}</h3>${d.gh}</div><div class="row"><button class="btn primary" data-go="quiz">Bắt đầu kiểm tra →</button></div>`;
    }
  }else if(dayTab==="gram"){
    body.innerHTML=`<div class="card gram"><div class="eyebrow">Ngữ pháp</div><h3>${esc(d.g)}</h3>${d.gh}</div>
      <div class="row" style="align-items:baseline"><h3>Câu ví dụ</h3><span class="muted" style="font-size:.84rem">Chạm vào một từ để tra nghĩa.</span></div><div class="ex">${d.exs.map(([zh,p,v])=>`<div class="exl"><button class="say" data-say="${esc(zh)}" aria-label="Nghe câu">${SPK}</button><span class="zh">${segHTML(zh)}${bmBtn(zh,p,v)}</span><span class="p">${pyColor(p)}</span><span class="v">${v}</span></div>`).join("")}</div>

      <div class="card" style="margin-top:12px"><div class="eyebrow">Tự đặt câu theo mẫu</div><div class="muted" style="font-size:.86rem">Dùng cấu trúc “${esc(d.g)}” để nói về bản thân bạn. Gia sư AI sẽ sửa và gợi ý câu tự nhiên hơn.</div>
        <div class="row" style="margin-top:8px;gap:8px"><input class="typein" id="gpIn" lang="zh-CN" autocomplete="off" placeholder="Câu của bạn (gõ hoặc 🎤 bàn phím)…" style="flex:1 1 200px;min-width:0"><button class="btn primary" id="gpGo" data-n="${n}">Chấm</button></div><div id="gpOut" aria-live="polite" style="white-space:pre-wrap;font-size:.92rem;line-height:1.55;margin-top:8px"></div></div>`:""}
      <div class="row"><button class="btn primary" data-go="speak">Tiếp: Luyện nói →</button></div>`;
  }else if(dayTab==="speak"){
    mountSpeak(body,d.words.length?d.exs.concat(d.rds):DIALOG.split("\n").map(l=>l.split("|").slice(1)),n);
  }else if(dayTab==="quiz"){
    const cnt=d.final?30:d.review?20:Math.min(12,Math.max(10,d.words.length));
    const pass=d.final?80:70;
    body.innerHTML=`<div class="card result"><div class="eyebrow">${cnt} câu · cần ${pass}% để hoàn thành</div>
      <p style="margin:0;max-width:60ch">Các dạng câu hỏi: chọn nghĩa, chọn chữ Hán, chọn pinyin đúng thanh, tự gõ pinyin, sắp xếp câu${canSpeak()?", nghe và chọn chữ":""}. Phím 1–4 để chọn, Enter để sang câu.</p>
      <button class="btn primary" id="startQ">Bắt đầu</button></div>`;
    $("#startQ").onclick=()=>{
      const pool=d.words.length?poolUpTo(n):ALL;
      const src=d.words.length?d.words:d.ext?ALL.filter(w=>w.day>30):ALL.filter(w=>w.day<=28);
      runQuiz(body,buildQuiz(src,pool,cnt,exPool(d)),dayQuizDone(n));

    mountWriter(body,d.words,false,n);
  }
  body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{dayTab=b.dataset.go;viewDay(n);window.scrollTo({top:0})});
}

4:["Số may mắn và số kiêng","8 (bā) gần âm 发 (fā, phát tài) nên rất được ưa chuộng. 4 (sì) gần âm 死 (sǐ, chết) nên nhiều tòa nhà không có tầng 4. 6 (liù) nghĩa là “thuận lợi”. Người Việt cũng kiêng số 4 và thích số 8, khá giống!"],
6:["Sinh nhật ăn mì","Ngày sinh nhật người Trung Quốc thường ăn 长寿面 (mì trường thọ). Sợi mì dài tượng trưng cho sống lâu, nên không cắn đứt sợi mì. Người lớn tuổi coi trọng sinh nhật tròn 60, 70, 80."],
9:["Trên bàn ăn","Món ăn đặt giữa bàn, mọi người cùng gắp như bữa cơm Việt. Không cắm đũa thẳng đứng vào bát cơm (giống cúng người chết). Khi đi ăn với bạn, người Trung Quốc thường tranh nhau trả tiền; bạn có thể nói 我请客 (wǒ qǐngkè, tôi mời)."],
10:["Trả giá và thanh toán","Ở chợ, chợ đêm có thể trả giá: 便宜一点儿吧. Trong siêu thị, trung tâm thương mại thì giá cố định. Hầu hết mọi nơi thanh toán bằng 微信 (WeChat Pay) hoặc 支付宝 (Alipay); nên cài sẵn trước khi sang."],
15:["Đi lại","Taxi tính tiền theo đồng hồ, ít khi trả giá. Người Trung Quốc hay gọi xe bằng ứng dụng 滴滴 (Dīdī). Tàu điện ngầm ở các thành phố lớn rất tiện, bảng tên ga có cả chữ Hán, pinyin và tiếng Anh."],
25:["Ở khách sạn","Người nước ngoài phải đưa 护照 (hộ chiếu) khi nhận phòng; khách sạn sẽ đăng ký tạm trú. Một số nơi giá rẻ không được nhận khách nước ngoài, nên đặt trước qua ứng dụng và kiểm tra kỹ. Thường phải 押金 (yājīn, đặt cọc)."],
13:["Ngủ trưa","Nhiều người Trung Quốc có thói quen 午休 (wǔxiū, nghỉ trưa) khoảng 12:00 đến 14:00, giống người Việt. Trường học và một số cơ quan nghỉ trưa khá lâu, nên đừng hẹn gặp hay gọi điện vào giờ này."],
21:["Trường Thành và vịt quay","Người Trung Quốc có câu 不到长城非好汉: chưa đến Trường Thành thì chưa phải hảo hán. Đến Bắc Kinh, món phải thử là 北京烤鸭 (vịt quay Bắc Kinh), ăn cuốn với bánh mỏng, hành và tương ngọt, hơi giống cách ăn cuốn của người Việt."],
27:["Thể diện","面子 (miànzi, thể diện) rất quan trọng. Tránh chê thẳng hay làm người khác mất mặt trước đông người; khi từ chối thường nói vòng: 我再想想 (để tôi nghĩ thêm). Được khen, người ta hay đáp 哪里哪里 (đâu có đâu) để tỏ ra khiêm tốn."],
36:["Nhảy quảng trường","Buổi tối ở công viên và quảng trường, rất nhiều cô bác cùng nhau 跳广场舞 (nhảy quảng trường) theo nhạc, khá giống các nhóm tập thể dục buổi sáng ở hồ Hoàn Kiếm. Người trẻ thì thích đi 逛街 (dạo phố) hoặc xem phim cuối tuần."],
28:["Quà nên tránh","Không tặng đồng hồ: 送钟 (sòng zhōng) đồng âm với 送终 (tiễn người chết). Không tặng ô 伞 (sǎn, gần âm 散 - chia ly) hay chia đôi quả lê 梨 (lí, gần âm 离 - xa cách). Quà màu đỏ, số chẵn được coi là may mắn; nhận quà bằng hai tay."]};

function readingHTML(d){if(!d.rds.length)return"";
  return `<div class="sect" id="rdBox"><div><div class="eyebrow">Bài đọc · Chặng ${d.week}</div><h3>${esc(d.rdt)}</h3></div>
  <div class="row"><button class="btn" id="playRd">${SPK} Nghe cả bài</button><button class="btn" id="shadowRd" ${canSpeak()?"":"disabled"}>🎧 Nhại theo</button>${canSpeak()?`<button class="btn" id="blindRd">👂 Nghe trước, đọc sau</button>`:""}<label class="row" style="gap:6px;font-size:.9rem"><input type="checkbox" id="rdPy"> Ẩn pinyin</label><label class="row" style="gap:6px;font-size:.9rem"><input type="checkbox" id="rdVi"> Ẩn nghĩa</label><button class="btn ghost" id="rdTime" data-n="${esc(String(d.n))}">⏱ Đọc tính giờ</button><span class="muted" style="font-size:.84rem">Chạm vào một từ để tra nghĩa.</span></div><div id="rdTimeO" aria-live="polite"></div>
  <div class="ex">${d.rds.map(([zh,p,v])=>`<div class="exl"><button class="say" data-say="${esc(zh)}" aria-label="Nghe câu">${SPK}</button><span class="zh">${segHTML(zh)}${bmBtn(zh,p,v)}</span><span class="p">${pyColor(p)}</span><span class="v">${v}</span></div>`).join("")}</div>${rcHTML(d.n)}</div>`}
function wireReading(d){const b=$("#rdBox");if(!b)return;
  $("#rdPy").onchange=e=>b.classList.toggle("nopy",e.target.checked);
  $("#rdVi").onchange=e=>b.classList.toggle("novi",e.target.checked);
  $("#playRd").onclick=playSeq(d.rds.map(x=>x[0]));
  const sh=$("#shadowRd");if(sh)sh.onclick=async()=>{if(sh._run){sh._run=0;sh.textContent="🎧 Nhại theo";return}const run=sh._run=Date.now();sh.textContent="■ Dừng nhại";toast("Nghe câu mẫu, khi khung chuyển viền đỏ nét đứt thì đến lượt bạn nói to theo. Mỗi câu 2 lần.");const rows=[...b.querySelectorAll(".exl")];
    for(let i=0;i<d.rds.length&&sh._run===run;i++){const zh=d.rds[i][0];rows.forEach(r=>r.style.outline="");const r=rows[i];if(r){r.style.outline="2px solid var(--jade)";r.style.outlineOffset="4px";r.scrollIntoView({block:"nearest",behavior:"smooth"})}
      for(let rep=0;rep<2&&sh._run===run;rep++){if(!await speakWait(zh))break;if(sh._run!==run)break;if(r)r.style.outline="2px dashed var(--seal)";await new Promise(z=>setTimeout(z,900+[...hanOnly(zh)].length*420));if(r)r.style.outline="2px solid var(--jade)"}}
    rows.forEach(r=>r.style.outline="");if(sh._run===run){sh._run=0;sh.textContent="🎧 Nhại theo";touchStreak(2);save();updateChrome();toast("Xong! Nhại theo (shadowing) mỗi ngày giúp nói trôi và đúng thanh hơn.")}}}

function micPolicy(){try{const fp=document.permissionsPolicy||document.featurePolicy;if(fp&&fp.allowsFeature)return fp.allowsFeature("microphone")}catch(e){}return null}

function webDict(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C||micPolicy()===false)return null;let H={},rec=null,act=false;
  return {web:true,onPartial:f=>{H.p=f},onFinal:f=>{H.f=f},onState:f=>{H.s=f},active:()=>act,
    start:()=>new Promise((res,rej)=>{rec=new C();rec.lang="zh-CN";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;let err=null;
      rec.onstart=()=>{act=true;if(H.s)H.s({state:"listening"});res()};
      rec.onresult=e=>{let it="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){if(H.f)H.f({text:r[0].transcript})}else it+=r[0].transcript}if(H.p)H.p({text:it})};
      rec.onerror=e=>{err=e.error;if(!act)rej({code:/not-allowed|service-not-allowed/.test(e.error)?"not_granted":"unavailable"})};
      rec.onend=()=>{const was=act;act=false;if(was&&H.s)H.s({state:"idle",reason:err==="not-allowed"?"not_granted":/network|service-not-allowed|language-not-supported|audio-capture/.test(err||"")?"unavailable":"stopped"})};
      const to=setTimeout(()=>{if(!act){try{rec.abort()}catch(x){}rej({code:"unavailable"})}},6000);rec.addEventListener&&rec.addEventListener("start",()=>clearTimeout(to));
      try{rec.start()}catch(x){clearTimeout(to);rej({code:"unavailable"})}}),
    stop:async()=>{if(rec&&act)rec.stop()}}}
function wireDict(d){dictNS=d;
  d.onPartial(e=>{if(spCtx&&spCtx.onPartial)spCtx.onPartial(e.text)});
  d.onFinal(e=>{if(spCtx){spCtx.text+=e.text;if(spCtx.onPartial)spCtx.onPartial("");d.stop().catch(()=>{})}});
  d.onState(e=>{if(spCtx&&spCtx.onState)spCtx.onState(e.state,e.reason)});
  if(location.hash.startsWith("#day-")&&dayTab==="speak"&&!QZ||location.hash==="#tones"&&!($("#spHubW")&&$("#spHubW").innerHTML))route();
}

const ZD="零一二三四五六七八九";
function num2zh(n){n=+n;if(n>=1000)return String(n).split("").map(x=>ZD[x]).join("");if(n<10)return ZD[n];
  if(n<100){const t=Math.floor(n/10),u=n%10;return (t>1?ZD[t]:"")+"十"+(u?ZD[u]:"")}
  const h=Math.floor(n/100),r=n%100;return ZD[h]+"百"+(r===0?"":r<10?"零"+ZD[r]:(r<20?"一":"")+num2zh(r))}
const zhOnly=t=>t.replace(/\d+/g,m=>num2zh(m)).replace(/[^\p{Script=Han}]/gu,"");
function lcsMarks(tgt,got){const a=[...tgt],b=[...got],m=a.length,n=b.length;const D=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  return {hit,score:m?D[0][0]/m:0}}
function mountSpeak(el,sents,dayN){

    el.innerHTML=`<div class="card sect result"><div class="eyebrow">Xong lượt luyện nói</div><div class="score num">${n?avg+"%":"✓"}</div>
      <p>${n?`Đã luyện ${n}/${sents.length} câu.`:`Đã đi hết ${sents.length} câu.`} ${weak.length?`${weak.length} câu nên luyện lại.`:n?"Rất tốt!":""}</p>
      <div class="row" style="justify-content:center">${weak.length?`<button class="btn primary" id="spWeak">Luyện lại ${weak.length} câu yếu</button>`:""}<button class="btn ${weak.length?"":"primary"}" id="spAgain">Luyện lại từ đầu</button></div></div>`;
    const w=$("#spWeak");if(w)w.onclick=()=>mountSpeak(el,weak,dayN);$("#spAgain").onclick=()=>mountSpeak(el,dayN==="hub"?shuffle(speakPool().slice()).slice(0,10):sents,dayN)};
  const canMic=()=>!!dictNS&&!dictZhOff;

    el.innerHTML=`<div class="card sect">
      <div class="row"><span class="eyebrow num">Câu ${idx+1}/${sents.length}</span><span class="spacer"></span><span class="muted" style="font-size:.84rem">${canMic()?"Nghe mẫu, rồi bấm Nói và đọc cả câu":"Nghe mẫu, nói to theo, rồi tự chấm"}</span></div>
      <div class="tgt" id="tgt">${esc(zh)}</div>

        ${canMic()?`<button class="btn primary mic" id="mic">${MIC} <span>Nói</span></button>`:""}${canRec()?`<button class="btn ${canMic()?"":"primary"}" id="recB">${window.__recOff?"🎙 Ghi âm (máy ghi âm điện thoại)":"● Ghi âm"}</button>`:""}</div>
      ${canMic()?"":`<div style="display:grid;gap:6px"><div class="row" style="gap:8px"><input class="typein" id="kbIn" autocomplete="off" lang="zh-CN" placeholder="🎤 Đọc bằng micro bàn phím" style="flex:1 1 200px;min-width:0"><button class="btn primary" id="kbGo">Chấm</button></div>

      ${canMic()?"":`<div class="row"><button class="btn" data-self="0">Còn vấp</button><button class="btn" data-self="1">Đọc trôi chảy</button></div>

      <div class="row"><button class="btn ghost" id="sPrev" ${idx?"":"disabled"}>← Câu trước</button><button class="btn ghost" id="sNext">${idx+1<sents.length?"Câu sau →":"Hoàn thành ✓"}</button></div></div>`;
    const rb=$("#recB");if(rb)rb.onclick=()=>recToggle(rb,$("#recBox"),zh,null,p);

    const grade=()=>{const got=zhOnly(spCtx.text),tgt=zhOnly(zh);
      if(!got){heard.innerHTML=`<div class="heard"><b>Chưa nghe rõ.</b><span class="muted">Nói to và gần micro hơn, rồi thử lại.</span></div>`;return}

      let k=0;$("#tgt").innerHTML=[...zh].map(c=>/\p{Script=Han}/u.test(c)?`<span class="${hit[k++]?"hit":"miss"}">${c}</span>`:esc(c)).join("");
      const col=pct>=85?"var(--good)":pct>=60?"var(--warn)":"var(--bad)";
      heard.innerHTML=`<div class="heard"><div class="row"><b style="color:${col}" class="num">${pct}%</b><span>${pct>=85?"Rất tốt, máy nghe đúng gần hết câu.":pct>=60?"Khá rồi. Chữ gạch đỏ là chữ máy chưa nghe ra.":"Nghe lại mẫu, chú ý thanh điệu của chữ gạch đỏ."}</span></div>
        <div class="meter"><i style="width:${pct}%;background:${col}"></i></div><div class="muted" style="font-size:.84rem">Máy nghe được: <span class="han">${esc(spCtx.text.trim())}</span></div></div>`;
      if(typeof dayN==="number")markStep(dayN,"speak");S.speak=S.speak||{};const key=dayN+":"+idx;S.speak[key]=Math.max(S.speak[key]||0,pct);touchStreak();save();updateChrome();

async function pitchTrack(blob){const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
  const buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close&&ac.close();const x=buf.getChannelData(0),sr=buf.sampleRate;
  const N=Math.round(sr*.04),hop=Math.round(sr*.01),minL=Math.floor(sr/420),maxL=Math.floor(sr/70);let peak=0;for(let i=0;i<x.length;i+=7)peak=Math.max(peak,Math.abs(x[i]));
  const out=[];for(let s0=0;s0+N+maxL<x.length;s0+=hop){let e=0;for(let i=0;i<N;i++)e+=x[s0+i]*x[s0+i];const rms=Math.sqrt(e/N);
    if(rms<peak*.06){out.push(null);continue}let best=0;const R=[];
    for(let L=minL;L<=maxL;L++){let c=0,e2=0;for(let i=0;i<N;i+=2){c+=x[s0+i]*x[s0+i+L];e2+=x[s0+i+L]*x[s0+i+L]}const r=c/Math.sqrt(e*e2/2+1e-9);R.push(r);if(r>best)best=r}

          if(mode==="recall"){S.write=S.write||{};S.write[cur]=Math.min(S.write[cur]??99,m);touchStreak();save();updateChrome()}solved.add(cur);if(dayN)markStep(dayN,"write");drawList();info();
          msg(`<b style="color:${m===0?"var(--good)":"var(--warn)"}">${m===0?"Hoàn hảo, không sai nét nào!":"Xong, sai "+m+" lần."}</b> ${mode==="trace"?"Thử chế độ Tự viết nhé.":""}`);
          ctl.innerHTML=`<button class="btn" id="wRedo">Viết lại</button>${mode==="trace"?`<button class="btn primary" id="wRecall">Tự viết</button>`:""}<button class="btn ${mode==="recall"?"primary":""}" id="wNext">Chữ tiếp →</button>`;
          $("#wRedo").onclick=build;$("#wNext").onclick=nextChar;const r=$("#wRecall");if(r)r.onclick=()=>{mode="recall";syncMode();build()}}});
    }
  }
  function syncMode(){el.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode))}
  function fallback(){
    $("#wmode").hidden=true;
    pad.innerHTML=`<div class="ghostch" id="ghost">${cur}</div><canvas id="cv"></canvas>`;
    ctl.innerHTML=`<button class="btn" id="clr">Xóa</button><button class="btn" id="gh">Ẩn chữ mờ</button>`;
    msg("Không tải được dữ liệu nét chữ, nên đây là ô viết tự do.");
    const cv=$("#cv");let ctx,drawing=false,last=null,ghost=true;
    const r=pad.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
    ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=cssv("--ink")||"#16211C";ctx.lineWidth=Math.max(6,r.width/30);
    const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
    cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill()};
    cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};
    cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
    $("#clr").onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
    $("#gh").onclick=e=>{ghost=!ghost;$("#ghost").style.visibility=ghost?"visible":"hidden";e.currentTarget.textContent=ghost?"Ẩn chữ mờ":"Hiện chữ mờ"};
    build=()=>{$("#ghost").textContent=cur;ctx.clearRect(0,0,cv.width,cv.height)};
  }
  $("#cl").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;cur=b.dataset.c;drawList();info();build()};
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;syncMode();info();build()});
  syncMode();drawList();info();
  loadStrokes().then(d=>{if(!el.isConnected||el._mwTok!==tok)return;if(d&&window.HanziWriter&&d[cur]){info();build()}else fallback()});
}
